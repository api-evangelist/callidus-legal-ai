          title: Refresh
          description: Regenerate instead of serving the cached set (the fresh result still overwrites the cache); sent after the user consumed a suggestion
          default: false
      type: object
      title: StarterSuggestionsRequest
      description: 'Task source for LLM-generated Task Assistant starter suggestions.


        Mirrors :class:`StartConversationRequest`''s task-link fields: exactly one of

        ``dataset_id`` / ``deposition_id`` / ``research_id`` identifies the task.'
