    TaskLinkResponse:
      properties:
        task_link:
          anyOf:
          - $ref: '#/components/schemas/TaskLinkInfo'
          - type: 'null'
      type: object
      title: TaskLinkResponse
      description: 'Envelope for the task-link lookup.


        Wrapping in an object (rather than returning a bare ``TaskLinkInfo | None``)

        keeps the not-task-tied case as a 200 with ``task_link: null`` — a bare

        ``null`` body can''t be parsed by the legacy ApiCall client.'
    AgentMode:
      type: string
      enum:
      - quick
      - standard
      - deep
      title: AgentMode
    SmartbotOptOutResponse:
      properties:
        opt_out:
          type: boolean
          title: Opt Out
      type: object
      required:
      - opt_out
      title: SmartbotOptOutResponse
    TaskLinkInfo:
      properties:
        module_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Module Type
        conversation_id:
          type: string
          title: Conversation Id
        dataset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Id
        legal_research_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Legal Research Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      type: object
      required:
      - conversation_id
      title: TaskLinkInfo
      description: 'Routing essentials for the task a chat was created in.


        Resolved from the chat''s ``parent_conversation_id`` (the task root). The

        client maps ``module_type`` + the relevant id to a per-module task route.

        ``conversation_id`` is the *root* conversation''s id (used by id-keyed routes

        like depositions); ``dataset_id`` is the discovery dataset id for

        dataset-backed modules (Timeline / Doc Review / Forensic / Reliance);

        ``legal_research_id`` is the Legal Research V3 session id for LR task roots.


        Field names are friendlier than the underlying ``Conversation`` columns they

        come from (``reference_data`` / ``research_id``).


        ``title`` is the task root''s display name, decrypted where the module stores

        it encrypted. It lets the client name the task itself ("Smith depo prep")

        instead of falling back to its module ("Deposition"); empty when the root

        was never titled, in which case the client keeps the module-name fallback.'
    StarterSuggestionsResponse:
      properties:
        suggestions:
          items:
            type: string
          type: array
          title: Suggestions
      type: object
      required:
      - suggestions
      title: StarterSuggestionsResponse
      description: Empty ``suggestions`` means generation failed or was too thin — the client keeps its static fallback.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ToolResponseRequest:
      properties:
        tool_use_id:
          type: string
          minLength: 1
          title: Tool Use Id
          description: The tool_use_id from the ask_user SSE event being answered
        decision:
          type: string
          enum:
          - confirm
          - cancel
          - answered
          title: Decision
          description: 'The option the user picked on the card: ''confirm''/''cancel'' for a write confirmation, or ''answered'' for a clarification questionnaire (including a skip-all, which is ''answered'' with no answers). Only the proceed-decision the paused tool declared lets it continue, so ''answered'' cannot authorize a write.'
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
          description: Optional structured payload returned to the paused tool call (e.g. doc_ids uploaded through an upload-widget gate). Only fields the tool opted into are merged into its input; omit for plain confirm/cancel tools.
      type: object
      required:
      - tool_use_id
      - decision
      title: ToolResponseRequest
      description: The user's decision for a pending ask_user confirmation question.
