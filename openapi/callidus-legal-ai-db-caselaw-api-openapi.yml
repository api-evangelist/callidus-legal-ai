openapi: 3.2.0
info:
  title: CallidusAI DB Caselaw API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: DB Caselaw
paths:
  /db_caselaw/queue/populate:
    post:
      tags:
      - DB Caselaw
      summary: Queue Opinions
      description: Populate the parse queue with clusterids.
      operationId: queue_opinions_db_caselaw_queue_populate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchJobQueue'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/batch/upload/openai:
    post:
      tags:
      - DB Caselaw
      summary: Upload Batch Job
      description: Upload a batch job to OpenAI for parsing dispositions.
      operationId: upload_batch_job_db_caselaw_batch_upload_openai_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadBatchJobs'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/batch/start/openai:
    post:
      tags:
      - DB Caselaw
      summary: Start Batch Job
      description: Start the batch jobs.
      operationId: start_batch_job_db_caselaw_batch_start_openai_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartBatchJobs'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/batch/process/openai:
    post:
      tags:
      - DB Caselaw
      summary: Process Batch Job
      description: Process the results of a batch completion.
      operationId: process_batch_job_db_caselaw_batch_process_openai_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessBatchJobs'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/batch/list/vertex:
    post:
      tags:
      - DB Caselaw
      summary: List Batch Jobs Vertex
      description: 'List all batch jobs.


        If `job_names` is provided, the diff is returned.'
      operationId: list_batch_jobs_vertex_db_caselaw_batch_list_vertex_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessBatchJobVertex'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/fetch_dispositions:
    post:
      tags:
      - DB Caselaw
      summary: Get Disposition
      description: Fetch disposition for a given cluster_id.
      operationId: get_disposition_db_caselaw_fetch_dispositions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispositionBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/dispositions:
    post:
      tags:
      - DB Caselaw
      summary: Get Dispositions
      description: Fetch hydrated dispositions for the given case ids.
      operationId: get_dispositions_db_caselaw_dispositions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseDBBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - $ref: '#/components/schemas/HydratedDisposition'
                  - $ref: '#/components/schemas/HydratedNonSubStantiveDisposition'
                propertyNames:
                  format: uuid
                type: object
                title: Response Get Dispositions Db Caselaw Dispositions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/fetch/hydrated_dispositions:
    post:
      tags:
      - DB Caselaw
      summary: Get Hydrated Disposition
      description: Fetch disposition for a given case_id.
      operationId: get_hydrated_disposition_db_caselaw_fetch_hydrated_dispositions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseDBBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/parse_disposition:
    post:
      tags:
      - DB Caselaw
      summary: Parse Request
      description: Parse disposition for a given cluster_id.
      operationId: parse_request_db_caselaw_parse_disposition_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispositionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/delete_dispositions:
    post:
      tags:
      - DB Caselaw
      summary: Delete Disposition
      description: Delete dispositions for given cluster_ids.
      operationId: delete_disposition_db_caselaw_delete_dispositions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDispositionsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/fetch/modifying_precedents:
    post:
      tags:
      - DB Caselaw
      summary: Fetch Incoming Modifying Precedents
      description: Fetch the modifying precedents for the given case ids.
      operationId: fetch_incoming_modifying_precedents_db_caselaw_fetch_modifying_precedents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseDBBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/generate_embeddings:
    post:
      tags:
      - DB Caselaw
      summary: Generate Embeddings
      description: Generate embeddings for db_caselaw.
      operationId: generate_embeddings_db_caselaw_generate_embeddings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateEmbeddings'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/generate_tsvectors:
    post:
      tags:
      - DB Caselaw
      summary: Generate Tsvectors
      description: Generate tsvectors for db_caselaw.
      operationId: generate_tsvectors_db_caselaw_generate_tsvectors_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTSVectors'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/add_slugs:
    post:
      tags:
      - DB Caselaw
      summary: Copy Slugs In
      description: Copy slugs from cl to db_caselaw.
      operationId: copy_slugs_in_db_caselaw_add_slugs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/add_cite_data:
    post:
      tags:
      - DB Caselaw
      summary: Copy Cite Data In
      description: Copy cite data from cl to db_caselaw.
      operationId: copy_cite_data_in_db_caselaw_add_cite_data_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/add_case_names:
    post:
      tags:
      - DB Caselaw
      summary: Copy Case Names In
      description: Copy case_names from cl to db_caselaw.
      operationId: copy_case_names_in_db_caselaw_add_case_names_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /db_caselaw/add_bluebook_names:
    post:
      tags:
      - DB Caselaw
      summary: Add Bluebook Names
      description: Derive Bluebook case names (full + short) for cases in db_caselaw missing them.
      operationId: add_bluebook_names_db_caselaw_add_bluebook_names_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HydratedParty:
      properties:
        name:
          type: string
          title: Name
          description: The name or label for the party.
          default: ''
        description:
          type: string
          title: Description
          description: A concise description of the party, emphasizing the nature of their involvement in the dispute and any relevant legal status or characteristics.
          default: ''
        roles:
          items:
            type: string
          type: array
          title: Roles
          description: An exhaustive List of legal roles that the party plays in the case.
        db_id:
          type: string
          format: uuid
          title: Db Id
      type: object
      required:
      - db_id
      title: HydratedParty
    HydratedFact:
      properties:
        fact:
          type: string
          title: Fact
        db_id:
          type: string
          format: uuid
          title: Db Id
      type: object
      required:
      - fact
      - db_id
      title: HydratedFact
    LitigationStage:
      type: string
      enum:
      - State Trial Court
      - State Court of Appeals
      - State Supreme Court
      - Federal District Court
      - Federal Court of Appeals
      - U.S. Supreme Court
      - Federal Specialized Court
      - Other
      title: LitigationStage
    AreasOfLaw:
      type: string
      enum:
      - Constitutional and Civil Rights Law
      - Personal Injury and Tort Law
      - Information Security Law
      - Banking Law
      - Municipal Law
      - Public and Administrative Law
      - Bankruptcy, Insolvency, and Restructuring Law
      - Law of Obligations
      - Food and Drug Law
      - Energy Law
      - Transportation Law
      - Personal and Family Law
      - Religious Law
      - Cannabis Law
      - Gaming Law
      - Securities and Financial Instruments Law
      - Contract Law
      - Labor and Employment Law
      - Education Law
      - Insurance Law
      - Real Property Law
      - Intellectual Property Law
      - Finance and Lending Law
      - Corporate Law
      - Criminal Law
      - Environmental and Natural Resource Law
      - Agriculture Law
      - Tax and Revenue Law
      - Health Law
      - Telecommunications, Media, and Entertainment Law
      - Commercial and Trade Law
      title: AreasOfLaw
    DispositionRequest:
      properties:
        cluster_id:
          type: integer
          title: Cluster Id
      type: object
      required:
      - cluster_id
      title: DispositionRequest
    StepType:
      type: string
      enum:
      - primary_judicial_process
      - alternative_dispute_resolution
      - judicial_review
      - other
      title: StepType
    CriminalLawSubAreasEnum:
      type: string
      enum:
      - Prison Law
      - Anti-Corruption Law
      - Asset Forfeiture Law
      - Organized Crime Law
      - Business and Financial Crimes Law
      - Cybercrime Law
      title: CriminalLawSubAreasEnum
    HydratedCauseOfAction:
      properties:
        db_id:
          type: string
          format: uuid
          title: Db Id
        cause_of_action:
          type: string
          title: Cause Of Action
        affirmative_defenses:
          items:
            $ref: '#/components/schemas/HydratedAffirmativeDefense'
          type: array
          title: Affirmative Defenses
        questions:
          items:
            $ref: '#/components/schemas/HydratedQuestion'
          type: array
          title: Questions
        sali_area_of_law:
          $ref: '#/components/schemas/AreasOfLaw'
        sali_sub_area_of_law:
          anyOf:
          - $ref: '#/components/schemas/ConstitutionalAndCivilRightsLawSubAreasEnum'
          - $ref: '#/components/schemas/PersonalInjuryAndTortLawSubAreasEnum'
          - $ref: '#/components/schemas/InformationSecurityLawSubAreasEnum'
          - $ref: '#/components/schemas/BankingLawSubAreasEnum'
          - $ref: '#/components/schemas/PublicAndAdministrativeLawSubAreasEnum'
          - $ref: '#/components/schemas/BankruptcyInsolvencyAndRestructuringLawSubAreasEnum'
          - $ref: '#/components/schemas/EnergyLawSubAreasEnum'
          - $ref: '#/components/schemas/TransportationLawSubAreasEnum'
          - $ref: '#/components/schemas/PersonalAndFamilyLawSubAreasEnum'
          - $ref: '#/components/schemas/ReligiousLawSubAreasEnum'
          - $ref: '#/components/schemas/SecuritiesAndFinancialInstrumentsLawSubAreasEnum'
          - $ref: '#/components/schemas/ContractLawSubAreasEnum'
          - $ref: '#/components/schemas/LaborAndEmploymentLawSubAreasEnum'
          - $ref: '#/components/schemas/InsuranceLawSubAreasEnum'
          - $ref: '#/components/schemas/RealPropertyLawSubAreasEnum'
          - $ref: '#/components/schemas/IntellectualPropertyLawSubAreasEnum'
          - $ref: '#/components/schemas/FinanceAndLendingLawSubAreasEnum'
          - $ref: '#/components/schemas/CorporateLawSubAreasEnum'
          - $ref: '#/components/schemas/CriminalLawSubAreasEnum'
          - $ref: '#/components/schemas/EnvironmentalAndNaturalResourceLawSubAreasEnum'
          - $ref: '#/components/schemas/TaxAndRevenueLawSubAreasEnum'
          - $ref: '#/components/schemas/TelecommunicationsMediaAndEntertainmentLawSubAreasEnum'
          - $ref: '#/components/schemas/CommercialAndTradeLawSubAreasEnum'
          - type: 'null'
          title: Sali Sub Area Of Law
      type: object
      required:
      - db_id
      - cause_of_action
      - affirmative_defenses
      - questions
      - sali_area_of_law
      - sali_sub_area_of_law
      title: HydratedCauseOfAction
    ConstitutionalAndCivilRightsLawSubAreasEnum:
      type: string
      enum:
      - Individual Rights Law
      - Environmental, Social, and Governance Law
      - Discrimination Law
      - Political Rights Law
      title: ConstitutionalAndCivilRightsLawSubAreasEnum
    HydratedStep:
      properties:
        step_type:
          $ref: '#/components/schemas/StepType'
          default: primary_judicial_process
        step_description:
          type: string
          title: Step Description
        db_id:
          type: string
          format: uuid
          title: Db Id
      type: object
      required:
      - step_description
      - db_id
      title: HydratedStep
    CaseDBBatchRequest:
      properties:
        case_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Case Ids
          description: a list of case ids
      type: object
      required:
      - case_ids
      title: CaseDBBatchRequest
    PersonalInjuryAndTortLawSubAreasEnum:
      type: string
      enum:
      - Personal Property Law
      - Product Liability Law
      - Defamation Law
      - Mass Torts Law
      - Negligence and Malpractice Law
      - Assault Law
      - Fraud and Economic Torts Law
      title: PersonalInjuryAndTortLawSubAreasEnum
    TrialPhase:
      type: string
      enum:
      - Filing
      - Discovery
      - Pretrial
      - Trial
      - Post-Trial
      title: TrialPhase
    TreatmentConfidence:
      type: string
      enum:
      - EXTREMELY_LOW
      - LOW
      - MEDIUM
      - HIGH
      - EXTREMELY_HIGH
      title: TreatmentConfidence
    CommercialAndTradeLawSubAreasEnum:
      type: string
      enum:
      - Trade Law
      - Commercial Transactions Law
      - Admiralty and Maritime Law
      - Consumer Protection Law
      - Franchise Law
      - Antitrust and Competition Law
      title: CommercialAndTradeLawSubAreasEnum
    HydratedDisposition:
      properties:
        db_id:
          type: string
          format: uuid
          title: Db Id
        parties:
          items:
            $ref: '#/components/schemas/HydratedParty'
          type: array
          minItems: 1
          title: Parties
        facts:
          items:
            $ref: '#/components/schemas/HydratedFact'
          type: array
          title: Facts
        procedural_history:
          items:
            $ref: '#/components/schemas/HydratedStep'
          type: array
          title: Procedural History
        causes_of_action:
          items:
            $ref: '#/components/schemas/HydratedCauseOfAction'
          type: array
          title: Causes Of Action
        legal_reasoning:
          type: string
          title: Legal Reasoning
        outcome:
          type: string
          title: Outcome
        legal_authorities_cited:
          items:
            $ref: '#/components/schemas/HydratedAuthority'
          type: array
          title: Legal Authorities Cited
        winning_party:
          anyOf:
          - $ref: '#/components/schemas/Party-Output'
          - type: 'null'
        disposition_metadata:
          $ref: '#/components/schemas/HydratedMetadata'
        modifying_precedents:
          items:
            $ref: '#/components/schemas/HydratedModifyingPrecedent'
          type: array
          title: Modifying Precedents
      type: object
      required:
      - db_id
      - parties
      - facts
      - procedural_history
      - causes_of_action
      - legal_reasoning
      - outcome
      - legal_authorities_cited
      - disposition_metadata
      - modifying_precedents
      title: HydratedDisposition
    HydratedQuote:
      properties:
        quote:
          type: string
          title: Quote
        db_id:
          type: string
          format: uuid
          title: Db Id
        pincites:
          items:
            $ref: '#/components/schemas/Pincite'
          type: array
          title: Pincites
      type: object
      required:
      - quote
      - db_id
      - pincites
      title: HydratedQuote
    DeleteDispositionsRequest:
      properties:
        cluster_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Cluster Ids
        start_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start Index
        end_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: End Index
        invalid:
          anyOf:
          - type: string
            enum:
            - all
            - detached_holdings
            - orphans_only
          - type: 'null'
          title: Invalid
        parse_model:
          anyOf:
          - type: string
            enum:
            - text-embedding-ada-002
            - text-embedding-3-large
            - text-davinci-003
            - gpt-35-turbo-0613
            - gpt-35-turbo-1106
            - gpt-35-turbo-16k-0613
            - gpt-35-turbo-0125
            - gpt-4-0613
            - gpt-4-32k-0613
            - gpt-4-turbo-0125
            - gpt-4o-0524
            - gpt-4o-2024-08-06
            - gpt-4o-mini
            - o1-mini-2024-09-12
            - gpt-3.5-turbo-instruct
