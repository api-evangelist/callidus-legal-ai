            - claude-sonnet-4-5-20250929
            - claude-haiku-4-5-20251001
            - claude-opus-4-1-20250805
            - claude-opus-4-1@20250805
            - claude-opus-4-6
            - claude-sonnet-4-6
            - claude-sonnet-5-5
            - deepseek-chat
            - gemini-2.5-flash
            - gemini-2.5-pro
