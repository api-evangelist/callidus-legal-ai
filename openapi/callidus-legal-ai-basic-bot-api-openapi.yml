              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/generate_image:
    post:
      summary: Basic Bot Generate Image
      description: 'Generate an image based on chat history and user request using Gemini 3.1 Flash Image Preview ("Nano Banana 2").


        The generated image is saved to the conversation as an AI message before being returned.

        Includes automatic retries for transient failures.'
      operationId: basic_bot_generate_image_basic_bot_generate_image_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicBotRequestRoot'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Basic Bot Generate Image Basic Bot Generate Image Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/generate_infographic:
    post:
      summary: Basic Bot Generate Infographic
      description: 'Generate an infographic image based on user request using Gemini 3.1 Flash Image Preview ("Nano Banana 2").


        Unlike generate_image, this endpoint:

        - Does not use conversation history (stateless)

        - Uses a specific prompt template optimized for infographic generation

        - Expects the request to contain both a question and a text response to visualize

        - Still saves the result to the conversation


        The generated infographic is saved to the conversation as an AI message before being returned.

        Includes automatic retries for transient failures.'
      operationId: basic_bot_generate_infographic_basic_bot_generate_infographic_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicBotRequestRoot'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Basic Bot Generate Infographic Basic Bot Generate Infographic Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
components:
  schemas:
    BasicBotCaseLaw:
      properties:
        case_name:
          type: string
          title: Case Name
        citation:
          type: string
          title: Citation
        court:
          type: string
          title: Court
        year:
          type: integer
          title: Year
        holding_summary:
          type: string
          title: Holding Summary
      type: object
      required:
      - case_name
      - citation
      - court
      - year
      - holding_summary
      title: BasicBotCaseLaw
    Body_basic_bot_upload_basic_bot_upload_start_post:
      properties:
        file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: File
        conversation_id:
          type: string
          title: Conversation Id
      type: object
      title: Body_basic_bot_upload_basic_bot_upload_start_post
    BasicBotCitationSearch:
      properties:
        request:
          $ref: '#/components/schemas/CaseCitationRequest'
      type: object
      required:
      - request
      title: BasicBotCitationSearch
    BasicBotResearchedRequest:
      properties:
        request:
          type: string
          title: Request
        conversationId:
          type: string
          title: Conversationid
        history:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: History
          default: []
        control_options:
          anyOf:
          - $ref: '#/components/schemas/BasicBotControlPanelOptions'
          - type: 'null'
          default:
            creativity: 0.0
            analysisDepth: 1
            legalFocus: 'True'
            jurisdictions: ''
        needs_citations:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Needs Citations
        is_advanced_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Advanced Mode
          default: false
        allowed_cases:
          items:
            $ref: '#/components/schemas/CaseSearchResult'
          type: array
          title: Allowed Cases
        allowed_statutes:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Allowed Statutes
        allowed_web_search:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Allowed Web Search
      type: object
      required:
      - request
      - conversationId
      - allowed_cases
      - allowed_statutes
      - allowed_web_search
      title: BasicBotResearchedRequest
    NotifyTurnCompleteRequest:
      properties:
        count:
          type: integer
          minimum: 1.0
          title: Count
          description: 'Number of qualifying messages in this turn: the user input plus the number of final displayed AI text responses.  Thinking blocks, tool calls, and tool results must be excluded by the caller.'
          default: 1
      type: object
      title: NotifyTurnCompleteRequest
      description: Request body for the notify-turn-complete endpoint.
    BasicBotValidateCases:
      properties:
        data:
          $ref: '#/components/schemas/BasicBotLegalResearchResponse'
      type: object
      required:
      - data
      title: BasicBotValidateCases
    PrecedentTreatment:
      type: string
      enum:
      - OVERRULES_FULLY
      - OVERRULES_PARTIALLY
      - LIMITS
      - REVERSES
      - VACATES
      - QUESTIONS
      - DEPARTS
      - DISTINGUISHES
      - CLARIFIES
      - HARMONIZES
      - FOLLOWS
      - EXTENDS
      - CITES
      - OTHER
      title: PrecedentTreatment
      description: A more complete version of PrecedentInteraction.
    LegalAuthoritiesJobStatus:
      properties:
        status:
          type: string
          title: Status
        job_id:
          type: string
          title: Job Id
        result:
          anyOf:
          - $ref: '#/components/schemas/LegalAuthoritiesJobResult'
          - type: 'null'
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        error_type:
          anyOf:
          - type: string
