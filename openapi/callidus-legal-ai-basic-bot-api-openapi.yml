openapi: 3.2.0
info:
  title: CallidusAI Basic Bot API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Basic Bot
paths:
  /basic_bot/conversation/{conversation_id}/token-count:
    get:
      summary: Basic Bot Conversation Token Count
      description: 'Returns the total LLM token count for all messages in a conversation.

        Messages are fetched and decrypted prior to counting.'
      operationId: basic_bot_conversation_token_count_basic_bot_conversation__conversation_id__token_count_get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                title: Response Basic Bot Conversation Token Count Basic Bot Conversation  Conversation Id  Token Count Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/conversation/{conversation_id}/summary:
    get:
      summary: Basic Bot Conversation Summary
      description: 'Summarize all messages in a conversation.

        Uses OpenAI if total tokens 250k.

        Automatically handles large conversations via smart message truncation.'
      operationId: basic_bot_conversation_summary_basic_bot_conversation__conversation_id__summary_get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Basic Bot Conversation Summary Basic Bot Conversation  Conversation Id  Summary Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/conversation/{conversation_id}/summary/create:
    post:
      summary: Basic Bot Conversation Summary Create
      description: 'Summarize all messages in an existing conversation, create a new conversation,

        save the summary as an AI message in that new conversation, and return the new conversation_id.

        Uses OpenAI if total tokens 370k and 950k, returns a content too large error.'
      operationId: basic_bot_conversation_summary_create_basic_bot_conversation__conversation_id__summary_create_post
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Basic Bot Conversation Summary Create Basic Bot Conversation  Conversation Id  Summary Create Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/conversation/{conversation_id}/attach-doc-hub-documents:
    post:
      summary: Basic Bot Attach Doc Hub Documents
      description: 'Attach doc-hub documents to a basic_bot conversation by document ID.

        Fetches each document''s text from the doc-hub vector store and saves it as

        context messages so they are included when the user sends a message.'
      operationId: basic_bot_attach_doc_hub_documents_basic_bot_conversation__conversation_id__attach_doc_hub_documents_post
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDocHubDocumentsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Basic Bot Attach Doc Hub Documents Basic Bot Conversation  Conversation Id  Attach Doc Hub Documents Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/conversation/{conversation_id}/attach-matter-context:
    post:
      summary: Basic Bot Attach Matter Context
      description: 'Attach matter context engine markdown output to a basic_bot conversation.

        Saves the markdown as a context message so it is included when the user sends a message.'
      operationId: basic_bot_attach_matter_context_basic_bot_conversation__conversation_id__attach_matter_context_post
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachMatterContextRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Basic Bot Attach Matter Context Basic Bot Conversation  Conversation Id  Attach Matter Context Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/conversation/{conversation_id}/notify-turn-complete:
    post:
      summary: Basic Bot Notify Turn Complete
      description: 'Notify the backend that an assistant turn has been saved for this conversation.


        Called by the frontend after persisting the AI response message to the

        database. Fires (or signals) a debounced Temporal workflow that will

        eventually save the conversation as a TASK_MEMORY doc in doc hub and

        trigger downstream matter-memory regeneration.


        ``body.count`` is forwarded to the debounce workflow so the message-count

        cap tracks only qualifying messages (user inputs + final AI text responses),

        not thinking blocks. Defaults to 1 in all cases (body omitted or body

        provided without an explicit count).


        This endpoint is intentionally best-effort:

        - If the Temporal trigger fails, the response still returns 200 and a

        warning is logged. The next turn will try again.

        - If the conversation is not linked to a matter (or memory is disabled),

        the downstream activity will skip the save silently.

        - The context engine''s live-collector fallback produces correct output

        even if this trigger never fires — it will just be slower on read.'
      operationId: basic_bot_notify_turn_complete_basic_bot_conversation__conversation_id__notify_turn_complete_post
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/NotifyTurnCompleteRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Basic Bot Notify Turn Complete Basic Bot Conversation  Conversation Id  Notify Turn Complete Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/upload/start:
    post:
      summary: Basic Bot Upload
      description: 'Accepts a file, uploads it to Azure Blob Storage, and starts a Temporal workflow for processing.

        Returns a workflow ID for polling status.'
      operationId: basic_bot_upload_basic_bot_upload_start_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_basic_bot_upload_basic_bot_upload_start_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadJobStartResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/upload/status/{job_id}:
    get:
      summary: Get Upload Status
      description: 'Check the status of an upload workflow using Temporal.

        Returns FileUploadJobStatus compatible with the frontend.


        Note: job_id is actually the workflow_id for Temporal workflows.'
      operationId: get_upload_status_basic_bot_upload_status__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadJobStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/search_case:
    post:
      summary: Basic Bot Search Case
      operationId: basic_bot_search_case_basic_bot_search_case_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicBotCitationSearch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Basic Bot Search Case Basic Bot Search Case Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/categorize-prompts:
    post:
      summary: Basic Bot Categorize
      description: Categorizes the user's request into one of the predefined categories.
      operationId: basic_bot_categorize_basic_bot_categorize_prompts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicBotRequestRoot'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Basic Bot Categorize Basic Bot Categorize Prompts Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/coverage-assessment:
    post:
      summary: Basic Bot Coverage Assessment
      description: 'Assess whether the user''s request can be reasonably answered using ONLY the

        cases/statutes already present in prior conversation messages'' ContextData.

        If yes, identify which cases/statutes should be used.'
      operationId: basic_bot_coverage_assessment_basic_bot_coverage_assessment_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicBotRequestRoot'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Basic Bot Coverage Assessment Basic Bot Coverage Assessment Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Basic Bot
  /basic_bot/contract_and_drafting:
