      description: 'Start a background job to generate legal authorities (cases and statutes) using AI.

        Returns a job ID for polling the status.'
      operationId: basic_bot_legal_research_prep_ai_cases_start_basic_bot_legal_research_prep_legal_authorities_ai_start_post
      requestBody:
        content:
