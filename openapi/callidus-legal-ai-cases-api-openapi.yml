openapi: 3.2.0
info:
  title: CallidusAI Cases API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Cases
paths:
  /cases/find-by-citation:
    post:
      tags:
      - Cases
      summary: Find Case By Citation
      description: 'Find a case by citation text directly.


        Also extracts pincite information (specific page references) if present

        in the citation.


        Args:

        request: Citation text to look up.

        session: Redis session dictionary.

        case_name: Optional expected case name. When provided, the DB

        result is validated against this name to avoid returning a

        wrong case (e.g. when a short-form pincite matches the wrong

        opinion in the same volume).'
      operationId: find_case_by_citation_cases_find_by_citation_post
      parameters:
      - name: case_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Case Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindByCitationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  additionalProperties: true
                - type: 'null'
                title: Response Find Case By Citation Cases Find By Citation Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/find-by-case-name:
    post:
      tags:
      - Cases
      summary: Find Case By Name
      description: 'Find a case by case name (mirrors find_case_by_citation structure).


        Returns single case details using HydratedDisposition.

        Designed to mainly be used by the add-in litigation endpoints.'
      operationId: find_case_by_name_cases_find_by_case_name_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddinFindByCaseNameRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AddinCaseDetailsResponse'
                - type: 'null'
                title: Response Find Case By Name Cases Find By Case Name Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/addin_case_lookup:
    post:
      tags:
      - Cases
      summary: Addin Case Lookup
      description: 'Unified case lookup endpoint that auto-detects query type and routes appropriately.


        Uses QueryParser to detect if query is a citation or case name,

        then routes to the appropriate lookup function.


        Add-In Case Lookup endpoint designed to mainly be used by the add-in litigation endpoints.


        Args:

        request: Contains query string (can be citation or case name)

        session: Redis session dictionary


        Returns:

        Case details response model or None if not found'
      operationId: addin_case_lookup_cases_addin_case_lookup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddinCaseLookupRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AddinCaseDetailsResponse'
                - type: 'null'
                title: Response Addin Case Lookup Cases Addin Case Lookup Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/search-citation:
    get:
      tags:
      - Cases
      summary: Search Cases By Citation
      description: 'Search for cases by citation string and return raw case metadata.


        This endpoint performs exact and fuzzy matching on citation strings

        and returns case metadata including court_name and year_filed.


        Public endpoint - no authentication required.'
      operationId: search_cases_by_citation_cases_search_citation_get
      parameters:
      - name: citation
        in: query
        required: true
        schema:
          type: string
          description: Citation string to search for (e.g., '123 F.3d 456')
          title: Citation
        description: Citation string to search for (e.g., '123 F.3d 456')
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of results to return
          default: 10
          title: Limit
        description: Maximum number of results to return
      - name: threshold
        in: query
        required: false
        schema:
          type: number
          maximum: 1.0
          minimum: 0.0
          description: Similarity threshold for fuzzy matching
          default: 0.3
          title: Threshold
        description: Similarity threshold for fuzzy matching
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CitationSearchResult'
                title: Response Search Cases By Citation Cases Search Citation Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/search-openlaws:
    post:
      tags:
      - Cases
      summary: Search Openlaws Authorities
      description: 'Standalone OpenLaws statute/regulation search for the case-search module.


        Restores the search the frontend lost when #5286 removed the legacy

        /legal_research/legal_authorities/search_openlaws route. Intentionally NOT research-scoped —

        the case-search statute tab has no matter context — and reuses the maintained OpenLaws

        resource rather than the deleted legacy httpx helpers.'
      operationId: search_openlaws_authorities_cases_search_openlaws_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthoritySearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoritySearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/full-text:
    post:
      tags:
      - Cases
      summary: Get Case Full Text
      description: 'Retrieve the full text HTML with citations for a case from CourtListener.


        Args:

        request: FindCasesRequest containing the cluster_id of the case


        Returns:

        The HTML with citations or None if not available'
      operationId: get_case_full_text_cases_full_text_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindCasesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/find:
    post:
      tags:
      - Cases
      summary: Find Cases
      description: 'Find cases by query text.


        This endpoint searches for cases matching the query text and returns

        a list of matching cases with their metadata.'
      operationId: find_cases_cases_find_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindCasesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Find Cases Cases Find Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/find-cases-by-hd:
    post:
      tags:
      - Cases
      summary: Find Cases By Hydrated Disposition
      description: 'Find cases by cluster_id using HydratedDisposition (add-in litigation endpoint).


        This endpoint uses find_cases_hydrated_disposition which calls fetch_hydrated_disposition

        and maps it to our chosen output format, providing a dedicated endpoint for add-in litigation flows.'
      operationId: find_cases_by_hydrated_disposition_cases_find_cases_by_hd_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindCasesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - additionalProperties: true
                  type: object
                - type: 'null'
                title: Response Find Cases By Hydrated Disposition Cases Find Cases By Hd Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/addin-case-search:
    post:
      tags:
      - Cases
      summary: Addin Case Search
      description: 'Add-in case search endpoint that intelligently routes queries based on type.


        This endpoint intelligently routes queries based on their type:

        - Case names (e.g., "Smith v. Jones") → Direct case name search

        - Citations (e.g., "123 U.S. 456") → Direct citation search

        - General queries → Full deep search workflow


        This endpoint starts a case search and returns immediately with a job_id.

        The frontend should poll GET /cases/addin-case-search/{job_id} for results.


        Args:

        request: Add-in case search request with query, jurisdictions, and max_cases

        session: Redis session

        temporal_client: Temporal client for workflows


        Returns:

        DeepSearchResponse with job_id for polling results'
      operationId: addin_case_search_cases_addin_case_search_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/AddinCaseSearchRequest'
              - $ref: '#/components/schemas/AddinCaseSearchWithFiltersRequest'
              title: Request
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/addin-case-search/{job_id}:
    get:
      tags:
      - Cases
      summary: Get Addin Case Search Result Endpoint
      description: 'Retrieve add-in case search results by job ID.


        This endpoint returns results in the add-in frontend format, transformed

        from the deep search results. The frontend should poll this endpoint

        periodically until status is "done" or "failed".


        Note: This endpoint does not perform any polling itself - it simply reads

        the current state from Redis. The frontend is responsible for polling.


        Optional filter query parameters can be provided to filter results:

        - year_start: Only include cases filed on or after this year

        - year_end: Only include cases filed on or before this year

        - area_of_law: Only include cases with this area of law

        - sub_area_of_law: Only include cases with this sub area of law


        Args:

        job_id: Job ID returned from POST /cases/addin-case-search

        request: FastAPI Request object

        session: Redis session

        year_start: Optional filter for minimum year

        year_end: Optional filter for maximum year

        area_of_law: Optional filter for area of law

        sub_area_of_law: Optional filter for sub area of law


        Returns:

        Dictionary with status, cases (transformed), and case_ids'
      operationId: get_addin_case_search_result_endpoint_cases_addin_case_search__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: year_start
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter cases filed after this year
          title: Year Start
        description: Filter cases filed after this year
      - name: year_end
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter cases filed before this year
          title: Year End
        description: Filter cases filed before this year
      - name: area_of_law
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by area of law
          title: Area Of Law
        description: Filter by area of law
      - name: sub_area_of_law
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by sub area of law
          title: Sub Area Of Law
        description: Filter by sub area of law
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddinCaseSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/get-opinion-content:
    post:
      tags:
      - Cases
      summary: Get Opinion Content
      description: Fetch the full text of a court opinion by cluster_id
      operationId: get_opinion_content_cases_get_opinion_content_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpinionContentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Opinion Content Cases Get Opinion Content Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/addin-extract-cluster-slug:
    post:
      tags:
      - Cases
      summary: Addin Extract Cluster Slug From Url
      description: 'Extract cluster_id and slug from a CourtListener URL and return a formatted URL.


        Supports:

        - CourtListener public URLs: https://www.courtlistener.com/opinion/{cluster_id}/{slug}/

        - Internal case details URLs: /case-details?caseid={cluster_id}&slug={slug}

        (the legacy /chat/caseDetails form is still accepted)


        Args:

        request: ExtractClusterSlugRequest containing the URL to parse


        Returns:

        JSON object with formatted CourtListener URL: {"url": "https://www.courtlistener.com/opinion/{cluster_id}/{slug}/"}


        Raises:

        HTTPException: If URL is missing, invalid, or cannot be parsed'
      operationId: addin_extract_cluster_slug_from_url_cases_addin_extract_cluster_slug_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractClusterSlugRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Addin Extract Cluster Slug From Url Cases Addin Extract Cluster Slug Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/search:
    post:
      tags:
      - Cases
      summary: Cases Search
      operationId: cases_search_cases_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSearch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/addin-cases-search:
    post:
      tags:
      - Cases
      summary: Addin Cases Search
      description: 'Enhanced case search that uses the legal research retrieval system to find more relevant cases.

        Uses AI to extract legal questions from the user''s query, then leverages specialized legal

        database search with holding extraction to deliver more precise results.'
      operationId: addin_cases_search_cases_addin_cases_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AICaseSearch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/search/ai:
    post:
      tags:
      - Cases
      summary: Ai Cases Search
      operationId: ai_cases_search_cases_search_ai_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AICaseSearch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/search/document-batch-stream:
    post:
      tags:
      - Cases
      summary: Document Batch Case Search Stream
      description: 'Processes document paragraphs by chunking them by character count and finding relevant cases for each batch in parallel.

        Streams results back to the frontend as each batch completes processing, maintaining paragraph indexes for mapping.


        Args:

        request: Contains the document paragraphs and usage data

        session: Redis session dictionary for storing user state


        Returns:

        Streaming response with case search results for each batch with paragraph mapping'
      operationId: document_batch_case_search_stream_cases_search_document_batch_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentBatchCaseSearch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/addin-case-relationship-analysis:
    post:
      tags:
      - Cases
      summary: Addin Analyze Case Relationship
      description: 'Analyzes the relationship between a specific case and the user''s original context.


        This endpoint receives details about:

        1. A case the user has selected from search results

        2. The user''s original document text/argument


        It returns an analysis of the relationship, including:

        - How the case is relevant to the user''s argument

        - Whether it supports or contrasts with the user''s position

        - Additional suggestions for related cases or statutes'
      operationId: addin_analyze_case_relationship_cases_addin_case_relationship_analysis_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseRelationshipRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/search/ai/suggested-queries:
    post:
      tags:
      - Cases
      summary: Ai Query Suggestions
      operationId: ai_query_suggestions_cases_search_ai_suggested_queries_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AICaseSearch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/verify-citation-accuracy:
    post:
      tags:
      - Cases
      summary: Wrapper
      operationId: wrapper_cases_verify_citation_accuracy_post
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/addin/search/filtered:
    post:
      tags:
      - Cases
      summary: Addin Filtered Case Search
      description: 'Search for cases with filtering options.


        Args:

        query: The search query text

        jurisdiction: Filter by jurisdiction (e.g., "California", "Federal")

        year_start: Filter by cases after this year

        year_end: Filter by cases before this year

        court_level: Filter by court level (e.g., "Federal", "State", "Tribal")

        area_of_law: Filter by area of law (e.g., "Criminal Law", "Constitutional Law")

        subcategory: Filter by subcategory of law (e.g., "First Amendment", "Fourth Amendment")

        session: Redis session dictionary


        Returns:

        List of cases with a matches_filters flag indicating if they matched the applied filters'
      operationId: addin_filtered_case_search_cases_addin_search_filtered_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddinFilteredCaseSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/addin/case-chat:
    post:
      tags:
      - Cases
      summary: Addin Case Chat
      description: 'Answers questions about a specific case using the case''s content and context.


        Args:

        request: Contains the citation, question, and optional document context

        session: Redis session dictionary for storing user state


        Returns:

        A response containing the answer to the user''s question'
      operationId: addin_case_chat_cases_addin_case_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddinCaseChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Addin Case Chat Cases Addin Case Chat Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/create-table-of-authorities:
    post:
      tags:
      - Cases
      summary: Create Table Of Authorities Endpoint
      description: Generate a Table of Authorities preview via JSONL stream.
      operationId: create_table_of_authorities_endpoint_cases_create_table_of_authorities_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableOfAuthoritiesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/prepare-toa-insertion:
    post:
      tags:
      - Cases
      summary: Prepare Toa Insertion Endpoint
      description: Resolve cases to cluster_ids and build marking plan via JSONL stream.
      operationId: prepare_toa_insertion_endpoint_cases_prepare_toa_insertion_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Request
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/batch-verify-citations:
    post:
      tags:
      - Cases
      summary: Batch Verify Citations
      description: 'Analyzes all citations in a document and verifies their accuracy.

        Processes each page individually and checks each citation against its source.


        Args:

        request: Contains document_pages with page numbers and text content

        session: Redis session dictionary for storing user state


        Returns:

        A comprehensive analysis of all citations in the document,

        highlighting any problematic references'
      operationId: batch_verify_citations_cases_batch_verify_citations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableOfAuthoritiesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Batch Verify Citations Cases Batch Verify Citations Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/batch-verify-citations-in-text:
    post:
      tags:
      - Cases
      summary: Batch Verify Citations In Text
      description: 'Extracts and verifies all legal citations in a provided text.


        This endpoint:

        1. Extracts all case citations from the input text

        2. Verifies each citation''s accuracy individually

        3. Returns comprehensive analysis for each citation found


        Args:

        request: Contains the document text with citations to analyze

        session: Redis session dictionary for storing user state


        Returns:

        Comprehensive analysis of all citations found in the text'
      operationId: batch_verify_citations_in_text_cases_batch_verify_citations_in_text_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddinVerifyCitationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Batch Verify Citations In Text Cases Batch Verify Citations In Text Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/batch-verify-citations-in-text-stream:
    post:
      tags:
      - Cases
      summary: Batch Verify Citations In Text Stream Route
      description: 'Legacy endpoint (develop flow): single document text, extract citations,

