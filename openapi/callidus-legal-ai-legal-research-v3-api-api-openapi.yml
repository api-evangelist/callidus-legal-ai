          anyOf:
          - $ref: '#/components/schemas/ResearchMilestones'
          - type: 'null'
      type: object
      required:
      - events
      - done
      title: ResearchProgressSnapshot
      description: 'What the polling endpoint returns: the full event log + done flag.


        ``terminal_status`` is additive: None until the run marks done, then "done" (legacy "1") or

        "failed". A reader that only checks ``done`` is unaffected — a failed run still sets done=true so

        the polling client stops; the status merely lets a caller distinguish success from failure.'
    FactsEvidenceFact:
