        Runs the form filler once over the documents (the same engine that populates parties on the

        matter intake path), so the intake form can prefill parties for a document-upload research

        with no linked matter. One pass over the aggregated text reconciles the same party referred

        to differently across documents.'
      operationId: extract_intake_parties_legal_research_v3_documents_intake_parties_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractIntakePartiesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractIntakePartiesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/matter/{matter_id}/complaint-causes:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: Get Matter Complaint Causes
      description: 'Poll for the operative complaint''s causes of action to prefill LR intake.


        Selects the best complaint on the matter, then reads its parsed causes from the case-context

        artifact — enqueuing on-demand extraction and reporting GENERATING when the artifact isn''t

        ready yet (the FE keeps polling, and drops silently on its own deadline). Returns COMPLETED

        with an empty result when the matter has no complaint.'
      operationId: get_matter_complaint_causes_legal_research_v3_matter__matter_id__complaint_causes_get
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterComplaintCausesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/documents:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: List Research Documents
      description: List all source documents linked to this research.
      operationId: list_research_documents_legal_research_v3__research_id__documents_get
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchDocumentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/documents/{document_id}:
    delete:
      tags:
      - 'Legal Research: V3 API'
      summary: Unlink Research Document
      description: Remove a document from this research (unlink, not delete).
      operationId: unlink_research_document_legal_research_v3__research_id__documents__document_id__delete
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AuthorityVerificationStatus:
      type: string
      enum:
      - pending
      - failed
      - valid
      - outdated
      - not_found
      - unverifiable
      title: AuthorityVerificationStatus
    GeneratedDocumentType:
      type: string
      enum:
      - brief
      - complaint
      - memo
      - motion
      - overview_pdf
      - msj_motion
      - msj_mpa
      - mtd_motion
      - mtd_mpa
      - demand_letter
      - mil_motion
      - mts_motion
      - pi_motion
      - appellate_brief
      - mtd_filing
      - msj_filing
      title: GeneratedDocumentType
      description: 'Write-side constraint for ``generated_documents.document_type`` (ENG-17017 item 22).


        The column itself stays free text (no DB enum, no migration) — this only closes off the

        write sites so a typo can''t silently open a new bucket. Values are exact, byte-for-byte

        matches of the strings already persisted; do NOT rename/renumber members, that would orphan

        existing rows. Distinct from ``DraftDocumentType`` above (an intake *intent*, e.g. its

        DEMAND_LETTER spells "demand-letter-document") and from the unrelated ``DocumentType`` in

        ``intake.document_analysis.types`` (input-document classification).'
    RelevantHolding:
      properties:
        db_ids:
          $ref: '#/components/schemas/HoldingDbIds'
        holding:
          type: string
          title: Holding
        generalized_holding:
          type: string
          title: Generalized Holding
        contextual_similarity:
          $ref: '#/components/schemas/ContextualSimilarity'
        legal_similarity:
          $ref: '#/components/schemas/LegalSimilarity'
        citation_score:
          type: number
          title: Citation Score
        is_slip:
          type: boolean
          title: Is Slip
          default: false
        llm_relevance:
          $ref: '#/components/schemas/RelevanceLevel'
          default: Unknown
      type: object
      required:
      - db_ids
      - holding
      - generalized_holding
      - contextual_similarity
      - legal_similarity
      - citation_score
      title: RelevantHolding
    RetrievalStepResponse:
      properties:
        status:
          $ref: '#/components/schemas/DocumentStatus'
        holdings:
          anyOf:
          - items:
              $ref: '#/components/schemas/RelevantHolding'
            type: array
          - type: 'null'
          title: Holdings
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - status
      title: RetrievalStepResponse
    SeedParty:
      properties:
        full_name:
          type: string
          title: Full Name
        party_group:
          $ref: '#/components/schemas/PartyGroup'
          default: other
        roles:
          items:
            type: string
          type: array
          title: Roles
        involvement:
          type: string
          title: Involvement
          default: ''
      type: object
      required:
      - full_name
      title: SeedParty
    ResearchCompletionReport:
      properties:
        complete:
          type: boolean
          title: Complete
        blocking_gaps:
          items:
            $ref: '#/components/schemas/CompletionGap'
          type: array
          title: Blocking Gaps
        warnings:
          items:
            $ref: '#/components/schemas/CompletionGap'
          type: array
          title: Warnings
        checked_at:
          type: string
          format: date-time
          title: Checked At
      type: object
      required:
      - complete
      - checked_at
      title: ResearchCompletionReport
      description: Whole-research completeness verdict. In-memory only (not persisted).
    Formality:
      type: string
      enum:
      - casual
      - informal
      - formal
      - highly_formal
      title: Formality
    CommitSubQuestionRequest:
      properties:
        subquestions:
          items:
            $ref: '#/components/schemas/CommitSubQuestionItem'
          type: array
          title: Subquestions
      type: object
      required:
      - subquestions
      title: CommitSubQuestionRequest
    CommitKeyQuestionRequest:
      properties:
