        proposed_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Proposed Content
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - job_id
      - status
      title: ImproveJobStatusResponse
    ResearchProgressEvent:
      properties:
        phase:
          type: string
          title: Phase
        status:
          type: string
          enum:
          - started
          - completed
          - error
          title: Status
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        section_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Section Id
        section_status:
          anyOf:
          - type: string
