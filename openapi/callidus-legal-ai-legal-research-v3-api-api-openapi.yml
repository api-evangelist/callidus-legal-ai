      title: ResearchProgressEvent
      description: 'One phase transition published by the workflow.


        `section_id`/`section_status` are additive (ENG-17626): only `publish_section` sets them.

        Every pre-existing document-level event leaves them absent, so a reader that only looks at

        phase/status/detail is unaffected by their presence.'
    SoFStepResponse:
