openapi: 3.2.0
info:
  title: 'CallidusAI Legal Research: V3 API'
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: 'Legal Research: V3 API'
paths:
  /legal_research/v3/drafting-studio/prompts:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: List Prompt Overrides
      description: Return prompt catalog merged with active DB overrides.
      operationId: list_prompt_overrides_legal_research_v3_drafting_studio_prompts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptOverridesListResponse'
  /legal_research/v3/drafting-studio/prompts/{prompt_key}:
    put:
      tags:
      - 'Legal Research: V3 API'
      summary: Upsert Prompt Override
      description: Upsert a global Drafting Studio prompt override and invalidate cache.
      operationId: upsert_prompt_override_legal_research_v3_drafting_studio_prompts__prompt_key__put
      parameters:
      - name: prompt_key
        in: path
        required: true
        schema:
          type: string
          title: Prompt Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPromptOverrideRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertPromptOverrideResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - 'Legal Research: V3 API'
      summary: Delete Prompt Override
      description: Delete a prompt override so runtime falls back to the code default.
      operationId: delete_prompt_override_legal_research_v3_drafting_studio_prompts__prompt_key__delete
      parameters:
      - name: prompt_key
        in: path
        required: true
        schema:
          type: string
          title: Prompt Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearPromptOverrideResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: List User Researches
      description: List all researches for the current user.
      operationId: list_user_researches_legal_research_v3__get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalResearchV3Record'
                title: Response List User Researches Legal Research V3  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Create Research
      description: Create a new research with intake metadata.
      operationId: create_research_legal_research_v3__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/seed:
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Seed Research
      description: Create a research pre-populated from the matter portal.
      operationId: seed_research_legal_research_v3_seed_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeedResearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: Get Research Metadata
      description: 'READ: Get research metadata and assembled entities.'
      operationId: get_research_metadata_legal_research_v3__research_id__get
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchStepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - 'Legal Research: V3 API'
      summary: Set Research Metadata
      description: 'COMMIT: Replace base research data.'
      operationId: set_research_metadata_legal_research_v3__research_id__put
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchIntakeRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - 'Legal Research: V3 API'
      summary: Update Research Metadata
      description: 'COMMIT: Partially update base research data.'
      operationId: update_research_metadata_legal_research_v3__research_id__patch
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - 'Legal Research: V3 API'
      summary: Delete Research Endpoint
      description: Delete a research and all its related data.
      operationId: delete_research_endpoint_legal_research_v3__research_id__delete
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/full-research-progress:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: Get Full Research Progress
      description: 'READ: poll the full-research workflow''s live progress feed for this research.


        Returns all phase events published so far, a done flag, and the six committed-state

        milestones that drive the progress bar. Empty feed (workflow not running / never ran)

        → empty events, done=False. The progress bar polls this every 2s while `isAutoRunning`

        is true.'
      operationId: get_full_research_progress_legal_research_v3__research_id__full_research_progress_get
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchProgressSnapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/deepen-progress:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: Get Deepen Progress
      description: 'READ: poll the deepen agent''s OWN live progress feed for this research.


        Same shape as ``/full-research-progress`` (phase events + done flag) but a

        separate feed, so a deepen run surfaces here without lighting up the main

        fill progress bar. Empty feed (no deepen run active / never ran) → empty

        events, done=False. The FE polls this while a deepen action is running.'
      operationId: get_deepen_progress_legal_research_v3__research_id__deepen_progress_get
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchProgressSnapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/overview_bundle:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: Get Overview Bundle
      description: Aggregate every per-COA and per-question read slice for one research.
      operationId: get_overview_bundle_legal_research_v3__research_id__overview_bundle_get
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewBundleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/quick_answer/start:
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Start Quick Answer
      description: 'Start the quick answer Temporal workflow (Phase 1: parties, briefing, lightning in parallel).


        Returns 202 Accepted. FE polls step GET endpoints for progressive rendering.'
      operationId: start_quick_answer_legal_research_v3__research_id__quick_answer_start_post
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '202':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/full_research/start:
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Start Full Research
      description: 'Start the full research Temporal workflow.


        Returns 202 Accepted. FE polls step GET endpoints for progressive rendering.'
      operationId: start_full_research_legal_research_v3__research_id__full_research_start_post
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/FullResearchStartRequest'
              - type: 'null'
              title: Body
      responses:
        '202':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/ensure_fill:
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Ensure Fill
      description: 'Idempotent V3→V4 migration trigger, called when a research is opened in the V4 UI (ENG-18919).


        Four outcomes, so a user returning to an old V3 task in the new UI is never stuck:

        - Already-agentic (native V4 or previously migrated) → no-op; the normal V4 flow owns it.

        - Finished legacy V3 (full analysis complete, ``is_v3_finished``) → migrate to agentic WITHOUT

        running the fill (mark_research_agentic): the task lands as a normal V4 task with every action

        unlocked, its already-complete content untouched (no run, no charge).

        - Unfinished legacy V3 → migrate to agentic and auto-run the fill exactly once (the flag flip makes

        every later open take the already-agentic branch), charging as for a normal full-research run.

        - V4 disabled in this env → render as-is (no migrate).


        Safe to call on every open: each branch is cheap and the migration is single-shot.'
      operationId: ensure_fill_legal_research_v3__research_id__ensure_fill_post
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnsureFillResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/followup:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: Get Followup State
      description: 'READ: Get followup questions state.'
      operationId: get_followup_state_legal_research_v3__research_id__followup_get
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowupStepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - 'Legal Research: V3 API'
      summary: Commit Followup
      description: 'COMMIT: Save followup questions with user answers.'
      operationId: commit_followup_legal_research_v3__research_id__followup_put
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitFollowupRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/followup/generate:
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Generate Followup Suggestion
      description: 'GENERATE: Create followup questions and stage them.'
      operationId: generate_followup_suggestion_legal_research_v3__research_id__followup_generate_post
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '201':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/followup/generate-additional:
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Generate Additional Followup
      description: 'Generate 2 additional followup questions without replacing existing ones.


        Returns the full question list (existing + new) so the frontend can

        update its local draft in one shot.'
      operationId: generate_additional_followup_legal_research_v3__research_id__followup_generate_additional_post
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitFollowupRequest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/followup/draft:
    put:
      tags:
      - 'Legal Research: V3 API'
      summary: Save Followup Draft
      description: 'DRAFT: persist in-progress followup answers to the staged field.


        Autosave writes here, not to the committed ``followup`` field, so a followup

        the user has opened (or typed into) but not resolved stays GENERATED. That

        keeps abandonment distinguishable from an explicit Skip/Continue — which

        commit via ``PUT /followup`` — so the return-visit router can send the user

        back to the follow-up step instead of stranding them downstream (ENG-17652).'
      operationId: save_followup_draft_legal_research_v3__research_id__followup_draft_put
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitFollowupRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/summary:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: Get Summary State
      description: 'READ: Get the current summary state.'
      operationId: get_summary_state_legal_research_v3__research_id__summary_get
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryStepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - 'Legal Research: V3 API'
      summary: Commit Summary
      description: 'COMMIT: Save the summary.'
      operationId: commit_summary_legal_research_v3__research_id__summary_put
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitSummaryRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/summary/generate:
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Generate Summary Step
      description: 'GENERATE: Create a summary from the current research state.'
      operationId: generate_summary_step_legal_research_v3__research_id__summary_generate_post
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '201':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/summary/refresh:
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Refresh Summary
      description: Regenerate + commit summary with the latest research context.
      operationId: refresh_summary_legal_research_v3__research_id__summary_refresh_post
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/parties:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: Get Parties State
      description: 'READ: Return staged/committed parties in a symmetric shape.'
      operationId: get_parties_state_legal_research_v3__research_id__parties_get
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartiesStepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - 'Legal Research: V3 API'
      summary: Commit Parties Selection
      description: 'COMMIT: Store parties, preserving per-party IDs from the request.'
      operationId: commit_parties_selection_legal_research_v3__research_id__parties_put
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitPartiesRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/parties/generate:
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Generate Parties Suggestion
      description: 'GENERATE: Identify parties and stage.'
      operationId: generate_parties_suggestion_legal_research_v3__research_id__parties_generate_post
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '201':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/party_alignment:
    get:
      tags:
      - 'Legal Research: V3 API'
      summary: Get Party Alignment State
      description: 'READ: return the stored record, resolving (and persisting) it the first time it''s read.


        Shared with ENG-17495 WS3''s doc-generation call sites — see

        ``resources/party_alignment.py::get_or_resolve_party_alignment``''s own docstring.'
      operationId: get_party_alignment_state_legal_research_v3__research_id__party_alignment_get
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAlignment'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - 'Legal Research: V3 API'
      summary: Update Party Alignment
      description: 'COMMIT: apply user edits.


        Edited fields become provenance=user — sticky against every future resolution (see

        resources/party_alignment.py::merge_party_alignment).'
      operationId: update_party_alignment_legal_research_v3__research_id__party_alignment_put
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartyAlignmentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAlignment'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/party_alignment/resolve:
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Resolve Party Alignment Endpoint
      description: Re-run deterministic resolution and merge into the stored record (user edits untouched).
      operationId: resolve_party_alignment_endpoint_legal_research_v3__research_id__party_alignment_resolve_post
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAlignment'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /legal_research/v3/{research_id}/briefing:
    get:
      tags:
      - 'Legal Research: V3 API'
