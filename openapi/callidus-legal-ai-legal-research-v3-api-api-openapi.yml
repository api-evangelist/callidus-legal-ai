      description: 'COMMIT: persist attorney edits to one variant''s paragraphs, and demote the rest.


        Paragraphs have no downstream cascade, so this is the causes-of-action commit without the

        workflow triggers: validate, demote deselected paragraphs of this variant, write edited content,

