      - label
      title: ResearchExhibit
      description: "What one exhibit letter points to, for one research — the registry entry behind ``(Ex. A)``.\n\nLetters are per-research, never per-variant: Short inherits exactly the letters Extensive\nestablished. They are also never re-lettered. A matter with a Timeline & Facts task already has\na master exhibit set the attorney's notes and deposition outlines reference, so imported letters\nare preserved verbatim and gaps (citing A, D, G out of a master set) are correct — silently\nrenumbering the same document is the defect.\n\nCovers both provenances, matching the shape discovery's per-version ``exhibits`` JSONB already\nuses so the import is a copy rather than a translation:\n- a formal eDiscovery exhibit imported from the Timeline task (``filename``/``page``/\n  ``bates_number``, no doc-hub id);\n- a matter document the fill agent pulled from the record (``document_id`` so the UI can open it,\n  plus the supporting ``quote``)."
