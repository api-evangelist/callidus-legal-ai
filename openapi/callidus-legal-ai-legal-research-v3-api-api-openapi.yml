  /legal_research/v3/{research_id}/cases/agent:
    post:
      tags:
      - 'Legal Research: V3 API'
      summary: Discover Cases Agent
      description: 'Start a matter-wide first-pass case-search agent run (manual / wizard mode).


        The FE fires this whenever the cases step is committed; this endpoint owns

        the dedup so the FE doesn''t have to. Returns 202 immediately and the

        Cases-page status box polls `GET /{research_id}/agent-status`.


        Dedup order:

        1. `case_search_agent_considered_at` set → no-op (auto-flow or prior agent run

        already settled the matter). This is the durable ran-once guard.

        2. The fixed workflow id guards in-flight duplicates only (an id colliding with

        a RUNNING workflow always fails). `ALLOW_DUPLICATE` — NOT `FAILED_ONLY` —

        so a *closed* prior run never blocks: when `considered_at` is cleared

        (research reset, suite re-seeding), a re-trigger must actually run again.'
      operationId: discover_cases_agent_legal_research_v3__research_id__cases_agent_post
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '202':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
