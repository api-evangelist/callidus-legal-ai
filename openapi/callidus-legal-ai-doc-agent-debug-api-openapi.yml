          title: Terminal
        start_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Time
        close_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Close Time
        failure_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Message
        unresolved_reason:
          anyOf:
          - type: string
          - type: 'null'
