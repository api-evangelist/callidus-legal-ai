openapi: 3.2.0
info:
  title: CallidusAI Doc Agent Debug API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Doc Agent Debug
paths:
  /doc-agent-debug/run:
    post:
      tags:
      - Doc Agent Debug
      summary: Run Debug Draft Route
      description: 'Run the doc-agent v2 harness inline and stream a live trace over SSE.


        See ``app/modules/doc_agent_debug/service.py`` for the record wire

        contract (``event`` / ``step`` / ``message`` / ``final``).'
      operationId: run_debug_draft_route_doc_agent_debug_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocAgentDebugRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /doc-agent-debug/runs/search:
    get:
      tags:
      - Doc Agent Debug
      summary: Search Runs Route
      description: 'Find a run to inspect or share — see ``search.search_runs`` for the

        exact match rules (exact id/email, or a 3+ char document-name substring

        over ``doc_metadata.name``/``DocAgentSession.OutputFilename``/the

        trace-parsed draft title). Deliberately does not search

        ``Conversation.title`` — see that module''s docstring for why.


        Registered ahead of ``GET /runs/{run_id}`` so this literal ``/search``

        path isn''t swallowed by that route''s ``{run_id}`` path parameter.'
      operationId: search_runs_route_doc_agent_debug_runs_search_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Free-text search: exact run/conversation/user id, exact email, or (3+ chars) a document-name substring.'
          title: Q
        description: 'Free-text search: exact run/conversation/user id, exact email, or (3+ chars) a document-name substring.'
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only runs with this Status (e.g. 'failed', 'running').
          title: Status
        description: Only runs with this Status (e.g. 'failed', 'running').
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only runs created at or after this timestamp (ISO 8601).
          title: From
        description: Only runs created at or after this timestamp (ISO 8601).
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only runs created at or before this timestamp (ISO 8601).
          title: To
        description: Only runs created at or before this timestamp (ISO 8601).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocAgentDebugSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /doc-agent-debug/runs/{run_id}:
    get:
      tags:
      - Doc Agent Debug
      summary: Get Run Route
      description: 'Read-only inspection of one persisted ``DocAgentV2Run`` — real

        ``State``/``Versions``/``Tracking``/``status`` plus every

        ``model_usage_ledger`` row for its conversation, ``run_links.resolve_run_links``''s

        full best-effort output (``links``), and one signed download URL per

        resolved output (``output_downloads`` — see ``service.get_run_view``).

        Unlike ``POST /run``, this never runs the harness — it only reads what

        production runs already persisted.'
      operationId: get_run_route_doc_agent_debug_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocAgentDebugRunView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /doc-agent-debug/runs:
    get:
      tags:
      - Doc Agent Debug
      summary: Get Latest Run For Conversation Route
      description: 'Read-only inspection of the most recently created run for a

        conversation — see ``get_run_route`` and ``service.get_run_view_by_conversation``.'
      operationId: get_latest_run_for_conversation_route_doc_agent_debug_runs_get
      parameters:
      - name: conversation_id
        in: query
        required: true
        schema:
          type: string
          description: Conversation to look up the most recent run for.
          title: Conversation Id
        description: Conversation to look up the most recent run for.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocAgentDebugRunView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /doc-agent-debug/runs/{run_id}/trace:
    get:
      tags:
      - Doc Agent Debug
      summary: Get Run Trace Route
      description: 'Read-only page of a persisted run''s trace records — see

        ``service.get_run_trace``. ``records`` are raw persisted payload dicts,

        replayable through the frontend''s ``applyDebugRecord`` fold exactly like

        the live SSE stream from ``POST /run``.'
      operationId: get_run_trace_route_doc_agent_debug_runs__run_id__trace_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: after_seq
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Only return records with seq greater than this cursor (from a prior page's next_seq).
          title: After Seq
        description: Only return records with seq greater than this cursor (from a prior page's next_seq).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: Max records to return, clamped server-side to MAX_TRACE_RECORDS_LIMIT.
          default: 500
          title: Limit
        description: Max records to return, clamped server-side to MAX_TRACE_RECORDS_LIMIT.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocAgentDebugTraceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /doc-agent-debug/runs/{run_id}/bundle:
    get:
      tags:
      - Doc Agent Debug
      summary: Get Run Bundle Route
      description: 'Download-all: a zip of the run''s raw trace, run view (state/versions/

        tracking/usage ledger/resolved links), semantic doc, and every resolved

        output''s docx bytes, every entry (and the zip itself) filename-prefixed

        with the run id — see ``service.build_run_bundle``.'
      operationId: get_run_bundle_route_doc_agent_debug_runs__run_id__bundle_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /doc-agent-debug/runs/{run_id}/conversation:
    get:
      tags:
      - Doc Agent Debug
      summary: Get Run Conversation Route
      description: 'The run''s Smart Bot conversation, decoded through the same history

        loader Smart Bot''s own turns use, up to the run''s ``UpdatedAt``, with

        the ``generate_word_document`` handoff call pinned when it can be

        identified — see ``conversation.get_run_conversation``.'
      operationId: get_run_conversation_route_doc_agent_debug_runs__run_id__conversation_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocAgentDebugConversationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /doc-agent-debug/runs/{run_id}/workflows:
    get:
      tags:
      - Doc Agent Debug
      summary: Get Run Workflows Route
      description: 'Live Temporal ``describe()`` status for every workflow id

        ``run_links.resolve_run_links`` resolved for this run, plus plain-English

        diagnostics where Temporal and the run''s own ``Status`` disagree — see

        ``service.get_run_workflows``.'
      operationId: get_run_workflows_route_doc_agent_debug_runs__run_id__workflows_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocAgentDebugWorkflowsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /doc-agent-debug/pricing:
    get:
      tags:
      - Doc Agent Debug
      summary: Get Pricing Route
      description: 'Per-model pricing snapshot, for the debug UI''s client-side estimated

        cost by iteration/tool on the live test-run path (see

        ``service.get_pricing_view``).'
      operationId: get_pricing_route_doc_agent_debug_pricing_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocAgentDebugPricingResponse'
  /doc-agent-debug/overview:
    get:
      tags:
      - Doc Agent Debug
      summary: Get Overview Route
      description: 'Last-21-days production overview (real runs, no test-run bypass) —

        total/failed/stuck run counts, turn/iteration/tool-call/error averages,

        the `done`-event outcome mix, p50/p95 duration, cost, and the top-10

        failing tools/messages, grouped by day, newest first. Cached in-process

        for 5 minutes (see ``service.get_overview``''s module-level TTL cache).


        When either ``status`` or ``date`` is given, returns the matching run

        list (id/status/created_at/updated_at) instead of the aggregate — a

        later phase wires the frontend''s drill-down click (a day''s failed/stuck

        count) to these params.'
      operationId: get_overview_route_doc_agent_debug_overview_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Drill-down: only runs with this Status (e.g. ''failed'', ''running'').'
          title: Status
        description: 'Drill-down: only runs with this Status (e.g. ''failed'', ''running'').'
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: 'Drill-down: only runs created on this UTC calendar day.'
          title: Date
        description: 'Drill-down: only runs created on this UTC calendar day.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DocAgentDebugOverviewResponse'
                - $ref: '#/components/schemas/DocAgentDebugOverviewRunsResponse'
                title: Response Get Overview Route Doc Agent Debug Overview Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DocAgentDebugRunRequest:
      properties:
        document_title:
          type: string
          title: Document Title
        instructions:
          type: string
          title: Instructions
        matter_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Matter Id
        template_doc_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Template Doc Id
        max_iterations:
          type: integer
          title: Max Iterations
          default: 35
        authored_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Authored Content
      type: object
      required:
      - document_title
      - instructions
      title: DocAgentDebugRunRequest
      description: 'Mirrors the smart-bot ``draft_document`` tool payload (see

        ``temporal/activities/doc_agent_v2/draft.py``''s ``DraftDocumentInput``),

        plus a client-tunable (but server-clamped) iteration cap.'
    DocAgentDebugSearchResponse:
      properties:
        runs:
          items:
            $ref: '#/components/schemas/DocAgentDebugSearchRunRow'
          type: array
          title: Runs
        truncated:
          type: boolean
          title: Truncated
      type: object
      required:
      - runs
      - truncated
      title: DocAgentDebugSearchResponse
      description: '``GET /doc-agent-debug/runs/search``: up to 50 runs, newest first.


        ``truncated`` is ``True`` when more than 50 rows matched — the search

        box''s own hint to narrow with ``status``/``from``/``to`` rather than a

        silent, misleadingly-complete-looking list of exactly 50.'
    DocAgentDebugOverviewRunsResponse:
      properties:
        runs:
          items:
            $ref: '#/components/schemas/DocAgentDebugOverviewRunRow'
          type: array
          title: Runs
      type: object
      required:
      - runs
      title: DocAgentDebugOverviewRunsResponse
      description: 'Drill-down shape of ``GET /doc-agent-debug/overview`` when ``status``

        and/or ``date`` is given: the matching run list instead of the aggregate.'
    DocAgentDebugConversationResponse:
      properties:
        run_id:
          type: string
          title: Run Id
        conversation_id:
          type: string
          title: Conversation Id
        messages:
          items:
            $ref: '#/components/schemas/DocAgentDebugConversationMessageRow'
          type: array
          title: Messages
        draft_handoff_message_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Draft Handoff Message Index
        draft_handoff_args:
          anyOf:
          - $ref: '#/components/schemas/DocAgentDebugDraftHandoffArgs'
          - type: 'null'
      type: object
      required:
      - run_id
      - conversation_id
      - messages
      - draft_handoff_message_index
      - draft_handoff_args
      title: DocAgentDebugConversationResponse
      description: '``GET /doc-agent-debug/runs/{run_id}/conversation``: the run''s

        conversation, decoded up to the run''s own ``UpdatedAt``, with the

        ``generate_word_document`` tool call that started this run pinned via

        ``is_draft_handoff`` when it could be identified (exactly, by the

        resolved draft workflow id''s ledger key; or, failing that, by being the

        single such call in the window, or the closest in time to the run''s

        ``CreatedAt``) — see ``conversation.get_run_conversation``.

        ``draft_handoff_message_index`` and ``draft_handoff_args`` are ``None``

        when no ``generate_word_document`` call could be found in the window at

        all (e.g. history predating the ``Index`` column, or a run started some

        other way).'
    DocAgentDebugOverviewRunRow:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          title: Status
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
      type: object
      required:
      - id
      - status
      - created_at
      - updated_at
      title: DocAgentDebugOverviewRunRow
      description: 'One run in a drill-down list (``?status=``/``?date=``) — deliberately

        thinner than :class:`DocAgentDebugRunView`, which is for inspecting a

        single run, not listing many.'
    DocAgentDebugUsageLedgerRow:
      properties:
        step:
          type: string
          title: Step
        model:
          type: string
          title: Model
        input_tokens:
          type: integer
          title: Input Tokens
        output_tokens:
          type: integer
          title: Output Tokens
        cached_tokens:
          type: integer
          title: Cached Tokens
        cost_usd:
          anyOf:
          - type: string
          - type: 'null'
          title: Cost Usd
        credits_charged:
          type: string
          title: Credits Charged
        event_time:
          type: string
          title: Event Time
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency Key
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      type: object
      required:
      - step
      - model
      - input_tokens
      - output_tokens
      - cached_tokens
      - cost_usd
      - credits_charged
      - event_time
      - idempotency_key
      - metadata
      title: DocAgentDebugUsageLedgerRow
      description: One ``model_usage_ledger`` row, for the run inspection routes below.
    DocAgentDebugOutputRow:
      properties:
        doc_id:
          type: string
          title: Doc Id
        name:
          type: string
          title: Name
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        storage_account_alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Storage Account Alias
        storage_container:
          anyOf:
          - type: string
          - type: 'null'
          title: Storage Container
        upload_datetime:
          type: string
          title: Upload Datetime
      type: object
      required:
      - doc_id
      - name
      - location
      - storage_account_alias
      - storage_container
      - upload_datetime
      title: DocAgentDebugOutputRow
      description: 'One ``doc_metadata`` row matched to a run as one of its drafted outputs —

        see ``run_links.resolve_run_links``.


        ``storage_account_alias``/``storage_container`` (plus ``location``) are the

        exact three fields ``doc_storage.blob_ref_from_doc_metadata`` needs to build

        a ``BlobRef`` for signing a download URL (see ``service._sign_output_download``);

        kept alongside the display fields rather than requiring a second DocMetadata

        fetch just to sign what this resolver already read once.'
    DocAgentDebugConversationMessageRow:
      properties:
        index:
          type: integer
          title: Index
        message_id:
          type: string
          title: Message Id
        role:
          type: string
          title: Role
        content:
          title: Content
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        is_draft_handoff:
          type: boolean
          title: Is Draft Handoff
      type: object
      required:
      - index
      - message_id
      - role
      - content
      - created_at
      - is_draft_handoff
      title: DocAgentDebugConversationMessageRow
      description: 'One persisted Smart Bot ``Message`` row, decoded through

        ``smart_bot.services.history.rebuild_agent_history`` — see

        ``GET /doc-agent-debug/runs/{run_id}/conversation``.


        ``content`` is the raw Anthropic-style history entry''s ``content``

        verbatim — a plain string, or a list of ``text``/``tool_use``/

        ``tool_result``/``ask_user`` blocks — passed through with no reshaping,

        matching this package''s "raw persisted shape, no second schema"

        convention (see :class:`DocAgentDebugTraceResponse`).'
    DocAgentDebugResolvedInputs:
      properties:
        document_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Title
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
        template_doc_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Template Doc Id
        authored_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Authored Content
        user_request:
          anyOf:
          - type: string
          - type: 'null'
          title: User Request
        source:
          type: string
          title: Source
      type: object
      required:
      - document_title
      - instructions
      - template_doc_id
      - authored_content
      - user_request
      - source
      title: DocAgentDebugResolvedInputs
      description: 'The draft''s original inputs, resolved from Temporal history or, failing

        that, guessed from the first persisted user trace message — see

        ``run_links._resolve_inputs``. Any field may be ``None`` even when this

        object itself is present: the trace-fallback text only contains the

        title/instructions/user-request, never ``template_doc_id`` or

        ``authored_content`` (those are just noted as present in the prompt, not

        echoed verbatim).'
    DocAgentDebugOutputDownloadRow:
      properties:
        doc_id:
          type: string
          title: Doc Id
        name:
          type: string
          title: Name
        filename:
          type: string
          title: Filename
        download_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Download Url
        unresolved_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Unresolved Reason
      type: object
      required:
      - doc_id
      - name
      - filename
      - download_url
      - unresolved_reason
      title: DocAgentDebugOutputDownloadRow
      description: 'A resolved output''s signed download URL — one row per

        ``DocAgentDebugRunLinks.outputs`` entry, signed with the same

        account/expiry/content-disposition approach as

        ``doc_agent_v2/routes/router.py``''s ``doc_agent_output`` route (see

        ``service._sign_output_download``). ``filename`` is the run-id-prefixed

        name (``"{run_id}-{name}"``) baked into the signed URL''s

        ``Content-Disposition`` header, so a browser download always lands with

        that name regardless of what the URL''s query string carries.'
    DocAgentDebugDraftHandoffArgs:
      properties:
        document_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Title
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
        authored_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Authored Content
      type: object
      required:
      - document_title
      - instructions
      - authored_content
      title: DocAgentDebugDraftHandoffArgs
      description: 'The ``generate_word_document`` tool-call args on the message pinned as

        this run''s handoff — see ``conversation._find_draft_handoff``. ``None``

        fields mean that arg simply wasn''t passed on the call (``template_doc_id``

        is intentionally omitted here; it isn''t part of what a debug reader needs

        pinned alongside the handoff).'
    DocAgentDebugPricingResponse:
      properties:
        pricing:
          additionalProperties:
            $ref: '#/components/schemas/DocAgentDebugModelPriceRow'
          type: object
          title: Pricing
        credit_value_usd:
          type: number
          title: Credit Value Usd
      type: object
      required:
      - pricing
      - credit_value_usd
      title: DocAgentDebugPricingResponse
      description: 'Snapshot of ``services/pricing.py``''s pricing table for the debug

        UI''s client-side token-count -> estimated-cost math on the live

        (unpersisted) test-run path, which has no ``model_usage_ledger`` row to

        read a real cost from (see ``GET /doc-agent-debug/pricing``).'
    DocAgentDebugTraceResponse:
      properties:
        run_id:
          type: string
          title: Run Id
        records:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Records
        next_seq:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Seq
      type: object
      required:
      - run_id
      - records
      - next_seq
      title: DocAgentDebugTraceResponse
      description: 'Read-only page of a persisted run''s trace records — see

        ``GET /doc-agent-debug/runs/{run_id}/trace``.


        ``records`` are the raw persisted ``DocAgentV2RunTrace.payload`` dicts

        verbatim (the same ``event``/``step``/``message``/``semantic``/``final``

        wire shape the live debug SSE stream emits — see ``service.py``''s module

        docstring and ``app/modules/doc_agent_v2/services/trace/records.py``''s

        ``TraceRecordProducer``): no reshaping, so there is no second schema to

        keep in sync. This is also the exact shape ``GET .../bundle`` embeds as

        its ``{run_id}-trace.json`` entry — see ``service.build_run_bundle``.


        ``next_seq`` is the ``Seq`` of the last row in this page (or ``None``

        when ``records`` is empty), for cursor-based paging — pass it straight

        back as the next call''s ``after_seq``. An empty ``records`` list with

        ``next_seq=None`` means the run has no more records past the requested

        cursor.'
    DocAgentDebugModelPriceRow:
      properties:
        input:
          type: number
          title: Input
        cached:
          type: number
          title: Cached
        output:
          type: number
          title: Output
      type: object
      required:
      - input
      - cached
      - output
      title: DocAgentDebugModelPriceRow
      description: 'Per-million-token USD rates for one model — mirrors one entry of

        ``services/pricing.py``''s ``MODEL_PRICING``.'
    DocAgentDebugWorkflowIdRow:
      properties:
