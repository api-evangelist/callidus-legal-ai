openapi: 3.2.0
info:
  title: CallidusAI Suggestions API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Suggestions
paths:
  /suggestions/messages:
    post:
      summary: Messages Suggestion
      operationId: messages_suggestion_suggestions_messages_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSuggestions'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Messages Suggestion Suggestions Messages Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Suggestions
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    MessageSuggestions:
      properties:
        module:
          type: string
          title: Module
      type: object
      required:
      - module
      title: MessageSuggestions
