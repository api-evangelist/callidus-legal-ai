openapi: 3.2.0
info:
  title: CallidusAI Validate API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Validate
paths:
  /validate/user_variable:
    post:
      summary: Validate User Variable
      operationId: validate_user_variable_validate_user_variable_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateUserInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: number
                  - {}
                type: object
                title: Response Validate User Variable Validate User Variable Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Validate
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidateUserInput:
      properties:
        var_name:
          type: string
          title: Var Name
          description: The name of the variable for which the user provided an input
          examples:
          - statute
          - an area of law
        var_value:
          type: string
          title: Var Value
          description: The value of the variable provided by the user
          examples:
          - section 123
          - Tort Law
      type: object
      required:
      - var_name
      - var_value
      title: ValidateUserInput
