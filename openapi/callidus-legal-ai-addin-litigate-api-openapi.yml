openapi: 3.2.0
info:
  title: CallidusAI Addin Litigate API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Addin-Litigate
paths:
  /addin/litigate/convert-to-word:
    post:
      tags:
      - Addin-Litigate
      summary: Convert To Word
      description: 'Convert an uploaded document (PDF, DOC, TXT) to DOCX format.


        Accepts a single file upload and returns the converted DOCX as base64-encoded

        JSON (``{"docx_base64": "...", "filename": "..."}``), ready for Office.js

        ``createDocument()``.


        Args:

        file: The uploaded file to convert.

        session: Redis session (for auth validation).

        state: Application state (Aspose, etc.).


        Returns:

        JSONResponse with base64-encoded DOCX and output filename.'
      operationId: convert_to_word_addin_litigate_convert_to_word_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_convert_to_word_addin_litigate_convert_to_word_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /addin/litigate/find-relevant-cases:
    post:
      tags:
      - Addin-Litigate
      summary: Find Relevant Cases
      description: 'Find relevant cases for document paragraphs.


        Accepts the same ``{ document: [ParagraphData] }`` shape as citation

        verification. Streams JSONL results (status, group_result,

        final_result).'
      operationId: find_relevant_cases_addin_litigate_find_relevant_cases_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddinBatchVerifyCitationsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AddinBatchVerifyCitationsRequest:
      properties:
        document:
          items:
            $ref: '#/components/schemas/ParagraphData'
          type: array
          title: Document
      type: object
      required:
      - document
      title: AddinBatchVerifyCitationsRequest
      description: 'Request model for batch citation verification endpoint.

        Extracts and verifies all citations in a document (no specific citation required).

        Frontend sends paragraphs directly - no need to split text.

        Citation details are extracted later.'
    Body_convert_to_word_addin_litigate_convert_to_word_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_convert_to_word_addin_litigate_convert_to_word_post
    ParagraphData:
      properties:
        index:
          type: integer
          title: Index
        text:
          type: string
          title: Text
        listItemString:
          type: string
          title: Listitemstring
          default: ''
        pageNumber:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pagenumber
        uniqueLocalId:
          anyOf:
          - type: string
          - type: 'null'
          title: Uniquelocalid
      additionalProperties: true
      type: object
      required:
      - index
      - text
      title: ParagraphData
      description: Model for paragraph data structure.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
