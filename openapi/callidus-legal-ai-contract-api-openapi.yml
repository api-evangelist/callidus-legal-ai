  /contract/generate:
    post:
      summary: Contract Generate
      description: 'Generate a contract based on outline and uploaded documents.


        Args:

        request: JSON string containing request data including conversationId and stream flag

        files: Optional list of uploaded files

        fileMetadata: Optional list of JSON strings with file metadata

        doc_ids: Optional JSON-encoded list of DocHub document ID strings

        session: Redis session

        state: Application state


        Returns:

        EventSourceResponse for streaming or PlainTextResponse for non-streaming


        Raises:

        HTTPException: If request parsing fails, validation fails, or generation error occurs'
      operationId: contract_generate_contract_generate_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_contract_generate_contract_generate_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Contract
  /contract/generate_agent:
    post:
      summary: Contract Generate Agent
      description: 'Agent-first Draft Contract (durable). Starts a Temporal workflow that drafts

        the whole contract from the structured Draft Contract inputs, renders a DOCX,

        persists it to DocHub, and charges credits — then returns a ``job_id``

        immediately. The draft runs as a heartbeated Temporal activity on the general

        worker, so it survives a page refresh, tab close, network drop, and even a full

        web-process restart mid-draft; the frontend polls

        GET /generate_agent/status/{job_id} for progress and the rendered file.


        Standard Temporal status pattern: Temporal is the source of truth for terminal

        state (the status endpoint reads it via describe()/result()), and the drafting

        stepper is reported to the standard ``RedisStatusManager`` keyed by workflow id.


        Gated by config.CONTRACT_DRAFTING_USE_DOC_AGENT; the legacy per-section

        /generate path is unchanged and used when the flag is off.'
      operationId: contract_generate_agent_contract_generate_agent_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_contract_generate_agent_contract_generate_agent_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateAgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Contract
  /contract/generate_agent/status/{job_id}:
    get:
      summary: Contract Generate Agent Status
      description: 'Poll a durable agent Draft Contract job. Returns {status, message, step,

        total_steps, phase} while running, the rendered file (docx_base64 + filename +

        doc_id) on completion, or {status:"error", message}. Authorized to the user who

        started the job.


        Follows the platform''s standard Temporal status pattern: Temporal is the source

        of truth for terminal state (running/done/failed) via ``describe()``/result(),

        and the drafting stepper is read from the standard ``RedisStatusManager``.'
      operationId: contract_generate_agent_status_contract_generate_agent_status__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateAgentStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Contract
