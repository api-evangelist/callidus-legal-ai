openapi: 3.2.0
info:
  title: CallidusAI Contract API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Contract
paths:
  /contract/generate/followup:
    post:
      summary: Contract Generate Followup
      description: 'Generate follow-up questions for contract generation.


        Args:

        request: JSON string containing request data including conversationId

        files: Optional list of uploaded files

        fileMetadata: Optional list of JSON strings with file metadata

        doc_ids: Optional JSON-encoded list of DocHub document ID strings

        session: Redis session

        state: Application state


        Returns:

        JSONResponse with follow-up questions


        Raises:

        HTTPException: If validation fails or generation error occurs'
      operationId: contract_generate_followup_contract_generate_followup_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_contract_generate_followup_contract_generate_followup_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Contract
  /contract/generate/outline:
