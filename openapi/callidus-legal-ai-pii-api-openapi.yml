openapi: 3.2.0
info:
  title: CallidusAI Pii API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: pii
paths:
  /api/pii/process:
    post:
      summary: Process Pii
      operationId: process_pii_api_pii_process_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PIIProcess'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: number
                  - {}
                type: object
                title: Response Process Pii Api Pii Process Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - pii
components:
  schemas:
    PIIProcess:
      properties:
        request:
          type: string
