          type: string
          format: date-time
          title: Updated At
        ownership_type:
          type: string
          enum:
          - individual
          - entity
          - both
          - unknown
          title: Ownership Type
          description: 'Single-field summary of who owns this vehicle.


            ``individual`` = at least one personal owner; ``entity`` = held by a

            business (trust / LLC / S-Corp); ``both`` = mixed; ``unknown``

            = no owners attached yet.'
          readOnly: true
        primary_owner_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Owner Name
          description: 'Single-name fallback when the UI can''t render the full owners list.


            Prefers ``title_holder`` > ``co_title_holder`` > ``trust`` >

            ``corporate``, then highest ownership_percentage, then first owner

            by id. Returns None when no owners exist.'
          readOnly: true
        display_label:
          type: string
          title: Display Label
          description: 'Human-readable label for table rows and matter-memory bullets.


            Fallback chain: ``year make model`` → ``make model`` → ``VIN xxx`` →

            ``Vehicle``. Mirrors ``_build_bsi_name`` in the persistence layer so

            the API label matches the BSI ``name`` column.'
          readOnly: true
        title_status_label:
          type: string
          enum:
          - clean
          - salvage
          - rebuilt
          - lien
          - unknown
          title: Title Status Label
          description: 'Map ``has_lienholder`` + ``title_brands`` to the ``VehicleTitleStatus``

            contract — same logic as the persistence helper so the UI can show the

            title status without re-deriving it client-side.


            ``"clean"`` requires *positive title evidence* — at least one of

            ``title_number`` / ``title_issuing_state`` / ``title_issue_date`` /

            ``title_brands`` populated. Vehicles created from a KBB / BeenVerified

            valuation alone (no title uploaded yet) have all four nulled out and

            report ``"unknown"`` — absence of warning signals isn''t proof of a

            clean title.'
          readOnly: true
      type: object
      required:
      - id
      - dataset_id
      - created_at
      - updated_at
      - ownership_type
      - primary_owner_name
      - display_label
      - title_status_label
      title: VehicleDetailResponse
      description: 'Detail response — same shape as the list row today; reserved for

        future additions (e.g. associated auto loan statements, valuation

        history) without breaking the list response.'
