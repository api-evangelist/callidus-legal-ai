  /discovery/forensic/{dataset_id}/spend-by-category:
    get:
      tags:
      - eDiscovery
      summary: Get Spend By Category
      description: 'Get spend and transaction counts by group → category → sub_category with % and annualized breakdown.


        Groups are organizational (Living Expenses, Lifestyle Expenses, etc.). Categories

        are the stored tier (e.g. Transportation, Housing). Sub-categories are the granular

        tier (e.g. Fuel, Car Payment under Transportation). Aggregates banking (debits)

        and liability (charges); returns totals, percentages, and annualized spend at each level.


        Annualized spend = total_spend_in_window * 365.25 / days_in_window.'
      operationId: get_spend_by_category_discovery_forensic__dataset_id__spend_by_category_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      - name: annualized_method
        in: query
        required: false
        schema:
          enum:
          - last_30_days
          - last_90_days
          - last_6_months
          - last_12_months
          - ytd
          - custom
          type: string
          description: 'Time window for the annualized view. ''last_30_days'': trailing 30 days. ''last_90_days'': trailing 90 days. ''last_6_months'': trailing 6 calendar months. ''last_12_months'': trailing 12 calendar months (default). ''ytd'': January 1 of the latest transaction year through the latest transaction. ''custom'': use start_date and end_date (both required).'
          default: last_12_months
          title: Annualized Method
        description: 'Time window for the annualized view. ''last_30_days'': trailing 30 days. ''last_90_days'': trailing 90 days. ''last_6_months'': trailing 6 calendar months. ''last_12_months'': trailing 12 calendar months (default). ''ytd'': January 1 of the latest transaction year through the latest transaction. ''custom'': use start_date and end_date (both required).'
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Start date (YYYY-MM-DD) — required when annualized_method=custom
          title: Start Date
        description: Start date (YYYY-MM-DD) — required when annualized_method=custom
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: End date (YYYY-MM-DD) — required when annualized_method=custom
          title: End Date
        description: End date (YYYY-MM-DD) — required when annualized_method=custom
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
