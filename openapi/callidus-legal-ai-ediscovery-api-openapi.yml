    delete:
      tags:
      - eDiscovery
      summary: Discard Business Valuation Estimate
      description: 'Discard the cached LLM estimate (the "Discard" action).


        Clears ``llm_estimated_valuation`` / ``llm_valuation_basis`` /

        ``llm_valuation_generated_at`` so a dismissed estimate stops being listed

        and won''t re-prompt. Leaves ``manual_valuation`` and party overrides

        untouched — discarding the AI suggestion never disturbs a committed value.

        No-op if no inputs row exists yet.'
