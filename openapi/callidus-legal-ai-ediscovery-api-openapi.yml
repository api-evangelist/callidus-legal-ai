  /discovery/upload-url/{dataset_id}:
    get:
      tags:
      - eDiscovery
      summary: Upload Url
      description: 'Fetch a presigned URL for uploading files, the UI will take this and upload files directly to the bucket without

        having to involve us in the process. We will return when the customer tells us they want to import whatever they

        have uploaded using our import route.


        The SAS token expires after SAS_EXPIRATION_HOURS. For long-running bulk uploads, the UI can call this endpoint

        again to get a fresh token before the current one expires.'
      operationId: upload_url_discovery_upload_url__dataset_id__get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/download:
    get:
      tags:
      - eDiscovery
      summary: Download File
      description: 'Allow the customer to download the original file that they uploaded.


        For doc-hub backed timeline events, pass doc_hub_doc_id to route the

        download through DocHub storage instead of the dataset''s ediscovery container.


        HEAD requests return a simple JSON response indicating if the file exists.

        GET requests stream the file for download.'
      operationId: download_file_discovery_download_get
      parameters:
      - name: filename
        in: query
        required: true
        schema:
          type: string
          title: Filename
      - name: doc_hub_doc_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Hub Doc Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    head:
      tags:
      - eDiscovery
      summary: Download File
      description: 'Allow the customer to download the original file that they uploaded.


        For doc-hub backed timeline events, pass doc_hub_doc_id to route the

        download through DocHub storage instead of the dataset''s ediscovery container.


        HEAD requests return a simple JSON response indicating if the file exists.

        GET requests stream the file for download.'
      operationId: download_file_discovery_download_head
      parameters:
      - name: filename
        in: query
        required: true
