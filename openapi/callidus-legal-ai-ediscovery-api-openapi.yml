              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/exports:
    get:
      tags:
      - eDiscovery
      summary: List Dataset Exports
      description: 'List the downloadable exports for a dataset, newest first.


        Hybrid lookup:


        1. **DocHub-tagged exports** — query ``DocMetadata`` rows whose

        ``additional_info`` contains ``{"dataset_id": , "export_type": ...}``.

        Returned with a populated ``doc_hub_doc_id`` and a ``download_url``

        wired to the existing ``/discovery/download?doc_hub_doc_id=...``

        route. That route resolves the blob via ``DocMetadata.location``,

        which is the blob path *at upload time* — so dataset renames don''t

        break the link.

        2. **Legacy fallback** — if no DocMetadata rows match, list Azure blobs

        under ``{dataset_id}/.export/`` in the dataset''s container. Each

        blob becomes an entry with ``doc_hub_doc_id=None`` and a

        ``download_url`` pointing at ``/discovery/download?filename=...``

        (the original keyed-by-filename path). Pre-DocHub datasets stay

        discoverable without backfill.


        The FE doesn''t have to branch on which variant it got — it hits the

        pre-built ``download_url`` either way.'
      operationId: list_dataset_exports_discovery_dataset__dataset_id__exports_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      - name: export_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional discriminator filter — e.g. 'master_transaction_export'. When omitted, returns every tagged export for the dataset.
          title: Export Type
        description: Optional discriminator filter — e.g. 'master_transaction_export'. When omitted, returns every tagged export for the dataset.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetExportEntry'
                title: Response List Dataset Exports Discovery Dataset  Dataset Id  Exports Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/document/browser:
    get:
      tags:
      - eDiscovery
      summary: Dataset File View
      description: 'Build a paged response view object that contains the Document records that are part of the given dataset

        and its parent dataset (if one exists) so that the user can browse what files they''ve uploaded.

        Supports optional filename search.'
      operationId: dataset_file_view_discovery_dataset__dataset_id__document_browser_get
