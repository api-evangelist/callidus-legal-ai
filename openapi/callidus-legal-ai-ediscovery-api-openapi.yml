openapi: 3.2.0
info:
  title: CallidusAI E Discovery API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: eDiscovery
paths:
  /discovery/dataset/:
    get:
      tags:
      - eDiscovery
      summary: Dataset List
      description: 'This function will list all the currently created datasets for the given user ID (making the connection)

        and return them as a paginated list of DatasetResponse objects. It optionally filters datasets by their type.'
      operationId: dataset_list_discovery_dataset__get
      parameters:
      - name: dataset_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter datasets by their type (e.g., 'contract', 'discovery', 'benchmark')
          title: Dataset Type
        description: Filter datasets by their type (e.g., 'contract', 'discovery', 'benchmark')
      - name: include_linked
        in: query
        required: false
        schema:
          type: boolean
          description: Include linked datasets information in the response
          default: true
          title: Include Linked
        description: Include linked datasets information in the response
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (starting from 1)
          default: 1
          title: Page
        description: Page number (starting from 1)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of datasets per page (max 100)
          default: 5
          title: Page Size
        description: Number of datasets per page (max 100)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListPaginatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - eDiscovery
      summary: Dataset Create
      description: 'This function will create a dataset for the given user, if the user doesn''t exist in the database we''ll add them

        into it, then create the dataset. We''ll also generate an azure storage blob "path" that can be used to upload

        eDiscovery documents for the given dataset.'
      operationId: dataset_create_discovery_dataset__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset:
    get:
      tags:
      - eDiscovery
      summary: Dataset List
      description: 'This function will list all the currently created datasets for the given user ID (making the connection)

        and return them as a paginated list of DatasetResponse objects. It optionally filters datasets by their type.'
      operationId: dataset_list_discovery_dataset_get
      parameters:
      - name: dataset_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter datasets by their type (e.g., 'contract', 'discovery', 'benchmark')
          title: Dataset Type
        description: Filter datasets by their type (e.g., 'contract', 'discovery', 'benchmark')
      - name: include_linked
        in: query
        required: false
        schema:
          type: boolean
          description: Include linked datasets information in the response
          default: true
          title: Include Linked
        description: Include linked datasets information in the response
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (starting from 1)
          default: 1
          title: Page
        description: Page number (starting from 1)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of datasets per page (max 100)
          default: 5
          title: Page Size
        description: Number of datasets per page (max 100)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListPaginatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - eDiscovery
      summary: Dataset Create
      description: 'This function will create a dataset for the given user, if the user doesn''t exist in the database we''ll add them

        into it, then create the dataset. We''ll also generate an azure storage blob "path" that can be used to upload

        eDiscovery documents for the given dataset.'
      operationId: dataset_create_discovery_dataset_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}:
    get:
      tags:
      - eDiscovery
      summary: Dataset Find
      description: This function will find an already created dataset and return it to the caller.
      operationId: dataset_find_discovery_dataset__dataset_id__get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailDatasetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - eDiscovery
      summary: Dataset Update
      description: 'Update dataset fields from the request body.


        Persists name, context, case relevancy (background / anchors / considerations),

        and reliance options (expert_name, preferred_format). Does not change dataset_type

        or parent_id via PATCH (those remain create-time / separate flows).


        Optional fields on ``DatasetRequest`` default to ``None``. A JSON body that omits

        those keys is parsed as ``None`` and will clear the corresponding DB columns.

        Callers should send the full save payload (same shape as create), e.g.

        ``UpdateEDiscoveryDataset`` — not a partial PATCH that only sets name/context.'
      operationId: dataset_update_discovery_dataset__dataset_id__patch
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - eDiscovery
      summary: Dataset Delete
      description: This function will delete a dataset for the given user based on the query ID that is passed long to the route.
      operationId: dataset_delete_discovery_dataset__dataset_id__delete
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Dataset Delete Discovery Dataset  Dataset Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/task_id:
    get:
      tags:
      - eDiscovery
      summary: Dataset Task Id
      description: 'Return the platform task id (Conversation.id) linked to this dataset, if any.


        Used by the frontend for doc-hub integration: when creating an aiDiscovery dataset,

        the task is updated with reference_data = str(dataset_id). This endpoint lets the

        frontend resolve task_id from dataset_id so it can call "add document to task" and

        enable "Start processing" (workflow/import) for doc-hub-backed flows.'
      operationId: dataset_task_id_discovery_dataset__dataset_id__task_id_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetTaskIdResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/matter_file_suggestions:
    get:
      tags:
      - eDiscovery
      summary: Matter File Suggestions
      description: 'Return candidate matter-level files to suggest after the Add Files step.


        Same permission model as ``dataset_task_id``: requires ``can_view`` on the

        dataset (inherited or owner).'
      operationId: matter_file_suggestions_discovery_dataset__dataset_id__matter_file_suggestions_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      - name: expert_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Expert Name
      - name: expert_opinions
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Expert Opinions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterFileSuggestionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/copy_parent_docs:
    post:
      tags:
      - eDiscovery
      summary: Copy Parent Docs
      description: 'Copy doc-hub document links from a parent dataset''s task to this FACTS child''s task.


        Called once after dataset creation and task linking so the child''s file browser

        shows inherited documents before processing starts. Idempotent — safe to call

        multiple times.'
      operationId: copy_parent_docs_discovery_dataset__dataset_id__copy_parent_docs_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/count:
    get:
      tags:
      - eDiscovery
      summary: Dataset Document Count
      description: This function will find an already created dataset and return it to the caller.
      operationId: dataset_document_count_discovery_dataset__dataset_id__count_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      - name: with_score
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: With Score
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetDocumentStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/parties:
    get:
      tags:
      - eDiscovery
      summary: Dataset Parties
      description: 'This little guy has to run through all the contracts in the dataset and collect all "parties involved", when it finds a

        duplicate party it will update the frequency of the name. Then we shall sort the results by the most frequency. The goal is

        to find the customer''s company / entity names, the theory is that the customer will be uploading contracts that they are involved

        in and thus, their names shall appear the most in the party lists.'
      operationId: dataset_parties_discovery_dataset__dataset_id__parties_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetContractParty'
                title: Response Dataset Parties Discovery Dataset  Dataset Id  Parties Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/entities:
    post:
      tags:
      - eDiscovery
      summary: Dataset Entities
      description: 'Set the business entities for the dataset based on the user selecting the parties involved that represent

        their company''s dataset (dataset_parties() returns a list of all the parties, one or more of those shall be

        set as "entities" here)'
      operationId: dataset_entities_discovery_dataset__dataset_id__entities_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              title: Entities
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/revenue:
    post:
      tags:
      - eDiscovery
      summary: Dataset Set Revenue
      description: 'This function will go through all the dataset contracts and see if the ''revenue_party'' is one of the names in the

        dataset''s ''contract_entities'', if it is we will set revenue to True (even if it was False), otherwise we will set

        revenue to False (even if it was true). Because one company''s contract revenue is another companies expense :)'
      operationId: dataset_set_revenue_discovery_dataset__dataset_id__revenue_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetRevenueResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/export:
    post:
      tags:
      - eDiscovery
      summary: Dataset Export
      description: test
      operationId: dataset_export_discovery_dataset__dataset_id__export_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/summary:
    get:
      tags:
      - eDiscovery
      summary: Dataset Contract Summary
      description: 'We have a number of contract types, we want to collect all the types of contracts that are in this database and count the

        total occurance of each contract type, but separate them out by "revenue" vs. "non-revenue" for the customer. to be able to

        differenciate the results.'
      operationId: dataset_contract_summary_discovery_dataset__dataset_id__summary_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractSummaryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/columns:
    get:
      tags:
      - eDiscovery
      summary: Dataset Get Contract Mdata Columns
      description: Get metadata columns for contract data export/display.
      operationId: dataset_get_contract_mdata_columns_discovery_dataset__dataset_id__columns_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/details:
    post:
      tags:
      - eDiscovery
      summary: Dataset Get Contract Details
      description: Get detailed contract information with pagination and filtering.
      operationId: dataset_get_contract_details_discovery_dataset__dataset_id__details_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Page Size
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractDetailRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse_ContractDetailResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/score:
    post:
      tags:
      - eDiscovery
      summary: Dataset Contract Score Temporal
      description: 'Start the job that will run an ARQ job to score all the contracts, the user will expect this to take awhile so we''ll not give them all

        the answers right away, but tell them that it''s "started" and they can watch the job execution status for when it''s completed.'
      operationId: dataset_contract_score_temporal_discovery_dataset__dataset_id__score_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetTemporalJobsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/scores:
    post:
      tags:
      - eDiscovery
      summary: Dataset Get Contract Scores
      description: 'Fetch the general scores for the contract categories as well as the contract types and return them to the caller. We will send over all the grades

        and their totals and allow the UI to convert them to percentages if they want, they''ll know the total grades and where they all fit so they can

        generate %.'
      operationId: dataset_get_contract_scores_discovery_dataset__dataset_id__scores_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ContractScoreRequest'
              - type: 'null'
              title: Contract Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractScoreResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/scores/type:
    post:
      tags:
      - eDiscovery
      summary: Dataset Get Contract Scores Type
      description: Return the dataset scores collected by grades across all the criteria for a given contract type.
      operationId: dataset_get_contract_scores_type_discovery_dataset__dataset_id__scores_type_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ContractTypeScoreRequest'
              - type: 'null'
              title: Contract Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractTypeScoreResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/score/criteria:
    get:
      tags:
      - eDiscovery
      summary: Dataset Get Contract Score Criteria
      description: Fetch all scoring records for a given dataset and return them structured by category and revenue/non-revenue.
      operationId: dataset_get_contract_score_criteria_discovery_dataset__dataset_id__score_criteria_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetScoringCriteriaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - eDiscovery
      summary: Dataset Contract Score Criteria
      description: We want to build scoring records for all our categories.
      operationId: dataset_contract_score_criteria_discovery_dataset__dataset_id__score_criteria_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetScoringCriteriaRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/{dataset_id}/criteria:
    post:
      tags:
      - eDiscovery
      summary: Dataset Contract Dataset Criteria
      description: We want to build scoring records for all our categories.
      operationId: dataset_contract_dataset_criteria_discovery_dataset__dataset_id__criteria_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
              title: Criteria Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - eDiscovery
      summary: Contract Dataset Criteria Get
      description: 'This is a slightly non-dataset "scoring" route to send back all the optional scoring criteria to the user, this may include

        custom scoring criteria in the future. For now, it will just dump all the scoring criteria in the database.'
      operationId: contract_dataset_criteria_get_discovery_dataset__dataset_id__criteria_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoringCriteriaResponse'
                title: Response Contract Dataset Criteria Get Discovery Dataset  Dataset Id  Criteria Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/dataset/contract/categories:
    get:
      tags:
      - eDiscovery
      summary: Contract Contract Categories
      description: 'Returns the string enumeration of the contract categories so the user can select the ones to use when

        assigning scoring criteria to the categories.'
      operationId: contract_contract_categories_discovery_dataset_contract_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Contract Contract Categories Discovery Dataset Contract Categories Get
  /discovery/dataset/{dataset_id}/edit/timeline:
    post:
      tags:
      - eDiscovery
      summary: Dataset Edit Timeline
      description: 'Custom editing of the timeline that the LLM generated, that way customers can add/tweak/change times and dates.


        Supports both compressed and uncompressed request bodies. Response is automatically compressed by GZipMiddleware.'
      operationId: dataset_edit_timeline_discovery_dataset__dataset_id__edit_timeline_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
