  /discovery/forensic/{dataset_id}/investments/income-reconciliation:
    get:
      tags:
      - eDiscovery
      summary: Get Investment Income Reconciliation
      description: 'Read the per-(taxpayer, institution, year, kind) reconciliation rows

        written by ``reconcile_investment_income_activity``.


        Tax forms (1099-DIV/INT/R) are the source of truth when present;

        investment-statement-derived dividend / interest / realized-gain /

        retirement-distribution totals fill the gap when no tax form covers the

        year. Discrepancies (both sides present + amounts diverge) are surfaced

        via ``has_discrepancy`` on each row so the audit pane can highlight them.


        The reconciliation table is refreshed by the forensic completion

        workflow on every batch finish (and on tax-doc uploads via the same

        workflow re-trigger).'
      operationId: get_investment_income_reconciliation_discovery_forensic__dataset_id__investments_income_reconciliation_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentIncomeReconciliationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
