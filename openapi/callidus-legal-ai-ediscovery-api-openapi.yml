    put:
      tags:
      - eDiscovery
      summary: Put Business Valuation
      description: 'Write only the override-bearing fields; auto-fill values stay derived.


        Field-presence semantics: a field absent from the request is left

        unchanged; a field explicitly sent as null is CLEARED (override removed,

        auto-fill resumes). Detected via Pydantic''s ``model_fields_set``.


        Validates that per-party ownership_pct sums don''t exceed 100 (warn,

        don''t reject — the lawyer may be intentionally over-allocating during

        discovery), and that marital is one of the documented enum values

        (Pydantic enforces this at request validation time).


        The override writes themselves live in ``services.business_valuation`` —

        the same code path the Task Assistant''s ``set_business_valuation`` tool

        writes through.'
