          title: Ownership Type
          description: 'Single-field summary of who owns this property.


            ``individual`` = at least one natural-person owner; ``entity`` =

            held inside a business (trust / LLC / S-Corp); ``both`` = a

            mix (a person plus a trust/entity on the deed, etc.); ``unknown`` = no

            owners attached yet. Entity-role owners (``corporate`` / ``trust``) are

            the business itself and don''t count as individuals — otherwise a

            deed naming only the company would read as ``both``. A ``corporate`` /

            ``trust`` owner row counts as entity ownership even when the property

            hasn''t been linked to a ``businesses`` row yet (deed-scan-only state).'
