              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - eDiscovery
      summary: Post Business Valuation Estimate
      description: 'Generate (and cache) an LLM-driven valuation estimate.


        Pulls the linked financial statements + business profile, calls the

        valuation model via ``llm_client_v2``, stores the result on

        ``business_valuation_inputs``, and charges the centralized credit cost.


        Always returns 200. When none of the core financial statements (income

        statement, balance sheet, cash flow) exist, returns the envelope with

        ``status="insufficient_documents"`` and no ``estimate`` (no LLM call, no

        charge); a partial set proceeds and the model caveats the result.'
      operationId: post_business_valuation_estimate_discovery_forensic__dataset_id__businesses__business_id__valuation_estimate_post
      parameters:
      - name: dataset_id
        in: path
        required: true
