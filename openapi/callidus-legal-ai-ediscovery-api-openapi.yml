        schema:
          enum:
          - last_30_days
          - last_90_days
          - last_6_months
          - last_12_months
          - ytd
          - custom
          type: string
          description: 'Time window for the allocation view — must match the spend-by-category method so both panels display the same data. ''last_30_days'': trailing 30 days. ''last_90_days'': trailing 90 days. ''last_6_months'': trailing 6 calendar months. ''last_12_months'': trailing 12 calendar months (default). ''ytd'': January 1 of the latest transaction year through the latest transaction. ''custom'': use start_date and end_date (both required).'
          default: last_12_months
          title: Annualized Method
        description: 'Time window for the allocation view — must match the spend-by-category method so both panels display the same data. ''last_30_days'': trailing 30 days. ''last_90_days'': trailing 90 days. ''last_6_months'': trailing 6 calendar months. ''last_12_months'': trailing 12 calendar months (default). ''ytd'': January 1 of the latest transaction year through the latest transaction. ''custom'': use start_date and end_date (both required).'
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Start date (YYYY-MM-DD) — required when annualized_method=custom
