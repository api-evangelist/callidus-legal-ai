      summary: Rescore Focus Areas Status
      description: 'Report whether a focus-area rescore workflow is still running (ENG-15313).


        The rescore is fire-and-forget (no TemporalJob / analysis-run row), so the FE polls this

        with the ``workflow_id`` returned by the rescore POST to keep the "Scoring focus areas"

        indicator up until the scores land. Returns ``running=False`` for any unknown / terminal /

        unreachable workflow so the indicator always clears (fail-safe, never sticks).'
