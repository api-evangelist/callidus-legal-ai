            full owners list. Prefers the borrower (mortgage co-signor = strongest

            ownership signal), then primary_filer, then highest

            ownership_percentage, then first owner by id. The UI should still

            render the full ``owners`` list when space allows — this is the

            compact-cell fallback only.'
          readOnly: true
