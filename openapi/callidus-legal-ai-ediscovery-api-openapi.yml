                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - eDiscovery
      summary: Delete Balance Sheet Item
      description: 'Soft-delete a balance-sheet item.


        Sets ``is_active=false`` and keeps the row in the DB for audit. The row

        drops out of list / summary responses by default; ``?include_inactive=true``

        surfaces it. Also locks the row so the AI activity doesn''t resurrect it on

        re-ingest by re-promoting the same upstream entity.


        Hard delete is intentionally not exposed — restore is a follow-up.'
      operationId: delete_balance_sheet_item_discovery_forensic__dataset_id__balance_sheet_items__item_id__delete
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/forensic/{dataset_id}/balance-sheet/items:
    post:
      tags:
      - eDiscovery
      summary: Create Balance Sheet Item
      description: 'Create a manual balance-sheet item.


        Server-set provenance: ``source=''human_entered''``, ``is_locked=True``,

        ``is_active=True``, ``normalized_dedup_key=NULL`` — manual entries don''t

        dedup against AI-inferred rows so the attorney can intentionally record a

        separate row for the same account if needed (e.g. a closed account at the

        same bank as an active one).'
      operationId: create_balance_sheet_item_discovery_forensic__dataset_id__balance_sheet_items_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceSheetItemCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSheetItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/forensic/{dataset_id}/balance-sheet/items/{item_id}/restore:
    post:
      tags:
      - eDiscovery
      summary: Restore Balance Sheet Item
      description: 'Restore a soft-deleted balance-sheet item.


        Flips ``is_active=True`` and leaves ``is_locked=True`` — the row keeps

        its human-in-the-loop lock so the AI activity doesn''t try to overwrite

        or re-promote it on the next re-ingest. The attorney can re-edit or

        re-delete from there.


        Idempotent: restoring an already-active row is a 200 no-op so the UI

        can hit this endpoint without first checking the row''s state. Returns

        404 only when the item doesn''t exist in the dataset at all.'
      operationId: restore_balance_sheet_item_discovery_forensic__dataset_id__balance_sheet_items__item_id__restore_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSheetItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /discovery/forensic/balance-sheet/schemas:
    get:
      tags:
      - eDiscovery
      summary: Get Balance Sheet Schemas
      description: 'Schema-discovery endpoint for the balance-sheet UI.


        Returns closed-set vocabularies + JSON Schema for the create / update

        request bodies + per-category typed metadata schemas. Lets the UI build

        forms generically from the contract instead of hand-coding the field list

        per category. Auth-gated but otherwise dataset-independent — call once

        at app startup and reuse.'
