openapi: 3.2.0
info:
  title: CallidusAI Addin Doc Utils API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Addin-DocUtils
paths:
  /addin/doc-utils/bilingual-redline:
    post:
      tags:
      - Addin-DocUtils
      summary: Bilingual Redline
      description: 'Analyze bilingual tracked changes and stream edit instructions.


        Accepts the full document as base64-encoded .docx, analyzes the

        tracked changes, and streams targeted find/replace instructions

        as SSE events for the frontend to apply.


        SSE events:

        - progress_indicator: status updates and keepalives

        - edit_instruction: individual edit to apply

        - final_object: completion marker'
      operationId: bilingual_redline_addin_doc_utils_bilingual_redline_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BilingualRedlineRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BilingualRedlineRequest:
      properties:
        docx_base64:
          type: string
          maxLength: 20000000
          title: Docx Base64
      type: object
      required:
      - docx_base64
      title: BilingualRedlineRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
