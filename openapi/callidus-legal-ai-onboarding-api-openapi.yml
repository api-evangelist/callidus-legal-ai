openapi: 3.2.0
info:
  title: CallidusAI Onboarding API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Onboarding
paths:
  /onboarding/recommend_module:
    post:
      summary: Recommend Module
      description: 'Recommends a module based on the user''s persona details.


        Args:

        persona_details: User''s selected use case and preferences

        session: Redis session for user data


        Returns:

        ModuleRecommendation: The recommended module details'
      operationId: recommend_module_onboarding_recommend_module_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaDetails'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleRecommendation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Onboarding
components:
  schemas:
    ModuleRecommendation:
      properties:
        title:
          type: string
          title: Title
        message:
          type: string
          title: Message
        moduleId:
          type: string
          title: Moduleid
        alternativeMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Alternativemessage
        alternativeModuleId:
          anyOf:
          - type: string
          - type: 'null'
          title: Alternativemoduleid
      type: object
      required:
      - title
      - message
      - moduleId
      title: ModuleRecommendation
    PersonaDetailsRequest:
      properties:
        useCase:
          type: string
          title: Usecase
      type: object
      required:
      - useCase
      title: PersonaDetailsRequest
    PersonaDetails:
      properties:
        request:
          $ref: '#/components/schemas/PersonaDetailsRequest'
      type: object
      required:
      - request
      title: PersonaDetails
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
