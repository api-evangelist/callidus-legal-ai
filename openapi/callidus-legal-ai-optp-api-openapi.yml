        userEmail:
          type: string
          title: Useremail
        matterId:
          anyOf:
          - type: string
          - type: 'null'
          title: Matterid
      type: object
      required:
      - messagesAvailable
      - optpIngestionRate
      - options
      - userEmail
      title: OPTPData
    Options:
      properties:
        typeOfDeal:
          type: string
          title: Typeofdeal
        party1:
          $ref: '#/components/schemas/Party-Input'
        party2:
          $ref: '#/components/schemas/Party-Input'
        industry:
          type: string
          title: Industry
        secondaryIndustry:
          anyOf:
          - type: string
          - type: 'null'
          title: Secondaryindustry
        extraAttention:
          anyOf:
          - type: string
          - type: 'null'
          title: Extraattention
        dealBreakers:
