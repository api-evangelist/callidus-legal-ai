components:
  schemas:
    OPTPProvisionRequest:
      properties:
        request:
          $ref: '#/components/schemas/OPTPProvision'
      type: object
      required:
      - request
      title: OPTPProvisionRequest
    OPTPFollowUpRequest:
      properties:
        request:
          $ref: '#/components/schemas/OPTPFollowUp'
      type: object
      required:
      - request
      title: OPTPFollowUpRequest
    OPTPIncludedContracts:
      properties:
        baseContract:
          type: boolean
          title: Basecontract
          default: false
        comparisonContract:
          type: boolean
          title: Comparisoncontract
          default: false
      type: object
      title: OPTPIncludedContracts
    OPTPNewProvisionRequest:
      properties:
        request:
          $ref: '#/components/schemas/OPTPNewProvision'
      type: object
      required:
      - request
      title: OPTPNewProvisionRequest
    UserGoalUpdate:
      properties:
        userGoal:
          type: number
          title: Usergoal
      type: object
      required:
      - userGoal
      title: UserGoalUpdate
    Body_regenerate_optp_section_optp__optp_session_id__parties_extract_post:
      properties:
        file_content:
          anyOf:
          - type: string
          - type: 'null'
          title: File Content
      type: object
      title: Body_regenerate_optp_section_optp__optp_session_id__parties_extract_post
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Party-Input:
      properties:
        name:
          type: string
          title: Name
        relationship:
          type: string
          title: Relationship
      type: object
      required:
      - name
      - relationship
      title: Party
    Body_rank_and_match_provisions_optp_rank_and_match_post:
      properties:
        base_pickle:
          type: string
          contentMediaType: application/octet-stream
          title: Base Pickle
        comparison_pickle:
          type: string
          contentMediaType: application/octet-stream
          title: Comparison Pickle
      type: object
      required:
      - base_pickle
      - comparison_pickle
      title: Body_rank_and_match_provisions_optp_rank_and_match_post
    OPTPNewProvision:
      properties:
        provisionTitle:
          anyOf:
          - type: string
          - type: 'null'
          title: Provisiontitle
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
        baseDefinedTerms:
          anyOf:
          - type: string
          - type: 'null'
          title: Basedefinedterms
        provisionNames:
          anyOf:
          - type: string
          - type: 'null'
          title: Provisionnames
        provisionText:
          anyOf:
          - type: string
          - type: 'null'
          title: Provisiontext
        previousProvisionFormat:
          anyOf:
          - type: string
          - type: 'null'
          title: Previousprovisionformat
      type: object
      title: OPTPNewProvision
    OPTPData:
      properties:
        baseContractUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Basecontracturl
        comparisonContractUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Comparisoncontracturl
        baseContractDocId:
          anyOf:
          - type: string
          - type: 'null'
          title: Basecontractdocid
        comparisonContractDocId:
          anyOf:
          - type: string
          - type: 'null'
          title: Comparisoncontractdocid
        baseContractDocName:
          anyOf:
          - type: string
          - type: 'null'
          title: Basecontractdocname
        comparisonContractDocName:
          anyOf:
