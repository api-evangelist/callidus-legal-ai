          title: Favoritism
        useAdvancedModel:
          type: boolean
          title: Useadvancedmodel
          default: false
      type: object
      required:
      - typeOfDeal
      - party1
      - party2
      - industry
      - favoritism
      title: Options
    OPTPProvision:
