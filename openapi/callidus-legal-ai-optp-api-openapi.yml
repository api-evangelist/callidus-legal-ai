            type: object
          - type: 'null'
          title: Overallmetrics
        numberMatches:
          anyOf:
          - type: integer
          - type: 'null'
          title: Numbermatches
        provisionNames:
          anyOf:
          - type: string
          - type: 'null'
          title: Provisionnames
        party1:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Party1
        party2:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Party2
        industry:
          anyOf:
          - type: string
          - type: 'null'
          title: Industry
        secondaryIndustry:
          anyOf:
          - type: string
          - type: 'null'
          title: Secondaryindustry
        typeOfDeal:
          anyOf:
          - type: string
          - type: 'null'
          title: Typeofdeal
        baseDefinedTerms:
          anyOf:
          - type: string
          - type: 'null'
          title: Basedefinedterms
