openapi: 3.2.0
info:
  title: CallidusAI Integrations API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Integrations
paths:
  /integrations/clio/connect:
    get:
      tags:
      - Integrations
      summary: Connect Clio
      description: Redirect user to Clio's OAuth consent screen.
      operationId: connect_clio_integrations_clio_connect_get
      parameters:
      - name: return_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: URL path to redirect to after OAuth completes
          title: Return To
        description: URL path to redirect to after OAuth completes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/clio/callback:
    get:
      tags:
      - Integrations
      summary: Clio Callback
      description: 'Handle Clio''s OAuth redirect — exchange code for tokens.


        No JWT required — the user identity is extracted from the HMAC-signed

        state param that was created during the /connect redirect.'
      operationId: clio_callback_integrations_clio_callback_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/clio/status:
    get:
      tags:
      - Integrations
      summary: Clio Status
      description: Check if the current user has an active Clio connection.
      operationId: clio_status_integrations_clio_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionStatus'
  /integrations/clio/matters:
    get:
      tags:
      - Integrations
      summary: List Clio Matters
      description: Fetch matters from the user's connected Clio account.
      operationId: list_clio_matters_integrations_clio_matters_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: open
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          default: 200
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClioMattersResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/clio/documents:
    get:
      tags:
      - Integrations
      summary: List Clio Documents
      description: Fetch documents for a Clio matter.
      operationId: list_clio_documents_integrations_clio_documents_get
      parameters:
      - name: matter_id
        in: query
        required: true
        schema:
          type: integer
          description: Clio matter ID
          title: Matter Id
        description: Clio matter ID
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          default: 200
          title: Limit
      - name: page_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Page Token
      - name: folder_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Clio folder ID to browse into
          title: Folder Id
        description: Clio folder ID to browse into
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClioDocumentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/clio/disconnect:
    delete:
      tags:
      - Integrations
      summary: Disconnect Clio
      description: Revoke Clio connection and tokens.
      operationId: disconnect_clio_integrations_clio_disconnect_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /integrations/microsoft/connect:
    get:
      tags:
      - Integrations
      summary: Connect Microsoft
      description: 'Send the user to Microsoft''s consent screen.


        ``switch_account`` asks Microsoft for its account picker. Without it, a

        browser already signed in to Microsoft is sent straight back with the same

        account — so "use a different account" would silently reconnect the one

        already linked.'
      operationId: connect_microsoft_integrations_microsoft_connect_get
      parameters:
      - name: return_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: In-app path to return to once the connection completes
          title: Return To
        description: In-app path to return to once the connection completes
      - name: switch_account
        in: query
        required: false
        schema:
          type: boolean
          description: Force Microsoft's account picker so a different mailbox can be chosen
          default: false
          title: Switch Account
        description: Force Microsoft's account picker so a different mailbox can be chosen
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/microsoft/callback:
    get:
      tags:
      - Integrations
      summary: Microsoft Callback
      description: 'Handle Microsoft''s redirect back.


        No JWT here — the caller is Microsoft, and the user''s identity comes from

        the HMAC-signed state issued during ``/connect``.'
      operationId: microsoft_callback_integrations_microsoft_callback_get
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      - name: code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
      - name: error
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/microsoft/status:
    get:
      tags:
      - Integrations
      summary: Microsoft Status
      description: Whether this user has an active Microsoft connection.
      operationId: microsoft_status_integrations_microsoft_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionStatus'
  /integrations/microsoft/disconnect:
    delete:
      tags:
      - Integrations
      summary: Microsoft Disconnect
      description: 'Drop this user''s Microsoft connection.


        Folder links go first, exactly as they do when a different mailbox is

        connected: left behind, they would point at a connection with no tokens and

        fail every later sync with nothing telling the user why. Emails already

        imported stay in their matters — they are files there, not views into the

        mailbox.


        Microsoft exposes no OAuth revocation endpoint, so the provider config

        carries no revoke URL and this marks the connection revoked locally. Access

        is withdrawn fully from the user''s Microsoft account page.'
      operationId: microsoft_disconnect_integrations_microsoft_disconnect_delete
      responses:
        '204':
          description: Successful Response
  /integrations/outlook/folders:
    get:
      tags:
      - Integrations
      summary: List Outlook Folders
      description: 'Every mail folder in the connected mailbox, with display paths.


        The whole mailbox is returned and the picker renders what it is given, so

        narrowing the offer — to Inbox and its children, say — is a change here

        rather than anywhere downstream.


        Takes no request-scoped session on purpose. Walking a mailbox is a paginated

        network traversal, and a session injected by ``Depends`` stays checked out

        for the whole request — holding a pooled connection idle for the duration.

        The token is resolved in a short-lived session that closes before any Graph

        traffic begins.'
      operationId: list_outlook_folders_integrations_outlook_folders_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutlookFoldersResponse'
  /integrations/outlook/link/{matter_id}:
    get:
      tags:
      - Integrations
      summary: Get Outlook Link
      description: A matter's Outlook connection state, for the Overview row and emails view.
      operationId: get_outlook_link_integrations_outlook_link__matter_id__get
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutlookLinkStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Integrations
      summary: Unlink Outlook Folder
      description: 'Stop syncing this matter''s folder and take its emails out of the matter.


        The emails and the attachments extracted from them leave this matter only —

        the files stay in Doc Hub, other matters are untouched, and reconnecting the

        same folder brings everything back (ENG-23077). The client confirms with the

        user first; nothing here can put a removed email back except a re-sync.


        Returns 204, so the 403 is raised rather than returned: a response model

        inferred from a ``... | JSONResponse`` annotation is rejected on a

        body-less status code.'
      operationId: unlink_outlook_folder_integrations_outlook_link__matter_id__delete
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/outlook/emails/{matter_id}:
    get:
      tags:
      - Integrations
      summary: List Matter Emails
      description: 'The matter''s synced emails, newest first.


        Paged only when ``page`` is given. Without it the response is what it has

        always been — the newest ``limit`` emails — so a client from before paging,

        still loaded in a tab while this deploys, keeps showing its list.'
      operationId: list_matter_emails_integrations_outlook_emails__matter_id__get
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by subject, sender, or message body
          title: Search
        description: Filter by subject, sender, or message body
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100000
            minimum: 1
          - type: 'null'
          description: 1-based page of list rows. Omit for the newest `limit` emails, unpaged.
          title: Page
        description: 1-based page of list rows. Omit for the newest `limit` emails, unpaged.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterEmailsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/outlook/link:
    post:
      tags:
      - Integrations
      summary: Link Outlook Folder
      description: 'Link a folder to a matter and leave it ready for its first sync.


        Returns 202: the link exists immediately, but the emails behind it do not —

        the backfill runs separately and the response reports ``syncing``.'
      operationId: link_outlook_folder_integrations_outlook_link_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkOutlookFolderRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutlookLinkStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/outlook/sync/{matter_id}:
    post:
      tags:
      - Integrations
      summary: Sync Outlook Now
      description: Sync this matter's folder now, rather than waiting for the schedule.
      operationId: sync_outlook_now_integrations_outlook_sync__matter_id__post
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutlookSyncStartedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/outlook/sync-status/{matter_id}:
    get:
      tags:
      - Integrations
      summary: Get Outlook Sync Progress
      description: 'Progress of the running sync, for the first backfill''s progress display.


        Reports ``idle`` once Temporal no longer holds the run — the workflow is

        reaped after completion, and the durable outcome is on the link itself.'
      operationId: get_outlook_sync_progress_integrations_outlook_sync_status__matter_id__get
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutlookSyncProgressResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/connections:
    get:
      tags:
      - Integrations
      summary: List Connections
      description: List all active integration connections for the authenticated user.
      operationId: list_connections_integrations_connections_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionListResponse'
  /integrations/matters:
    get:
      tags:
      - Integrations
      summary: List Integration Matters
      description: Fetch matters from a connected integration, mapped to the StrongSuit matter shape.
      operationId: list_integration_matters_integrations_matters_get
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
          description: Integration provider id (e.g. 'clio')
          title: Provider
        description: Integration provider id (e.g. 'clio')
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: open
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Wildcard name search
          title: Query
        description: Wildcard name search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportableMattersResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/documents:
    get:
      tags:
      - Integrations
      summary: List Integration Documents
      description: 'Fetch documents from a connected integration.


        Provide either ``matter_id`` (StrongSuit ID, resolved via integration link)

        or ``external_matter_id`` (provider-side ID, used directly for browsing).'
      operationId: list_integration_documents_integrations_documents_get
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
          description: Integration provider id (e.g. 'clio')
          title: Provider
        description: Integration provider id (e.g. 'clio')
      - name: matter_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: StrongSuit matter ID (resolves via integration link)
          title: Matter Id
        description: StrongSuit matter ID (resolves via integration link)
      - name: external_matter_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: External matter ID (used directly)
          title: External Matter Id
        description: External matter ID (used directly)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          default: 200
          title: Limit
      - name: page_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Page Token
      - name: folder_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: External folder ID to browse into
          title: Folder Id
        description: External folder ID to browse into
      - name: contact_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: External contact ID to browse documents for
          title: Contact Id
        description: External contact ID to browse documents for
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Wildcard name search
          title: Query
        description: Wildcard name search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportableDocumentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/documents/download:
    post:
      tags:
      - Integrations
      summary: Download Integration Documents
      description: 'Download documents from an external provider and upload them to Azure.


        Returns blob metadata per document so the FE can feed them into the

        existing ``POST /document/add-documents`` pipeline.'
      operationId: download_integration_documents_integrations_documents_download_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadIntegrationDocumentsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadIntegrationDocumentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/matters/{external_id}/sync-status:
    get:
      tags:
      - Integrations
      summary: Check Matter Sync Status
      description: Check if a linked matter has updates in the external provider.
      operationId: check_matter_sync_status_integrations_matters__external_id__sync_status_get
      parameters:
      - name: external_id
        in: path
        required: true
        schema:
          type: string
          title: External Id
      - name: provider
        in: query
        required: true
        schema:
          type: string
          description: Integration provider id (e.g. 'clio')
          title: Provider
        description: Integration provider id (e.g. 'clio')
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterSyncStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/matters/enrich:
    post:
      tags:
      - Integrations
      summary: Enrich Integration Matter
      description: Re-fetch a single matter, run deterministic + LLM enrichment.
      operationId: enrich_integration_matter_integrations_matters_enrich_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrichMatterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportableMatter'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/clio/import-all-documents:
    post:
      tags:
      - Integrations
      summary: Start Clio Document Import
      description: 'Start a Temporal workflow to import all documents from a Clio matter.


        Returns 202 with a workflow_id the frontend can poll for progress.'
      operationId: start_clio_document_import_integrations_clio_import_all_documents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartClioDocumentImportRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/clio/import-status/{workflow_id}:
    get:
      tags:
      - Integrations
      summary: Get Clio Import Status
      description: Poll the status of a Clio document import workflow via Temporal query.
      operationId: get_clio_import_status_integrations_clio_import_status__workflow_id__get
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ImportableDocument:
      properties:
        provider:
          type: string
          title: Provider
        external_id:
          type: string
          title: External Id
        name:
          type: string
          title: Name
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
        size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size Bytes
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Id
        parent_folder_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Folder Name
      type: object
      required:
      - provider
      - external_id
      - name
      title: ImportableDocument
      description: A document from an external provider, shaped for import selection.
    DownloadDocumentItem:
      properties:
        external_id:
          type: string
          title: External Id
        name:
          type: string
          title: Name
        version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Id
      type: object
      required:
      - external_id
      - name
      title: DownloadDocumentItem
      description: A single document to download from an external provider.
    ClioDocumentVersion:
      properties:
        id:
          type: integer
          title: Id
        uuid:
          anyOf:
          - type: string
          - type: 'null'
          title: Uuid
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
        size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
      type: object
      required:
