    CheckDuplicateEntry:
      properties:
        hash:
          type: string
          title: Hash
          description: File hash, prefixed with its type (e.g. 'sha1:...').
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
          description: 'The file''s display name (the SAME name you will send to /add-document, e.g. ''05_Affidavit.pdf''). REQUIRED for reliable same-name duplicate detection: ''skip'' vs ''alias'' turns on whether a file with this exact name already lives at the target folder. Falls back to the last segment of relative_path when omitted — but send it explicitly for bare-file/root uploads where relative_path is null, or a byte-identical re-upload to the same place is misdetected as an alias instead of a skip (ENG-17767).'
        relative_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Relative Path
          description: 'The SAME relative_path you will send to /add-document: the folder-upload path incl. filename (e.g. ''dir01/test.txt''), or null for a bare file (send the name in ''filename''). Combined with target_directory_id to resolve where the file will live. Enables path-aware duplicate detection (ENG-17767): byte-identical content at a DIFFERENT path is a distinct record (a symlink alias), not a duplicate, so ''skip'' is returned only for a true no-op (same bytes+name at the same current path).'
        target_directory_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Directory Id
          description: The SAME target_directory_id (current folder) you will send to /add-document. None = DocHub root.
      type: object
      required:
      - hash
      title: CheckDuplicateEntry
