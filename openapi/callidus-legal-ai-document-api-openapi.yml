      - document_ids
      title: AdminFailedIngestRequeueRequest
    CheckDuplicateOne:
      properties:
        hash:
          type: string
          title: Hash
        exists:
          type: boolean
          title: Exists
        action:
          anyOf:
          - type: string
            enum:
            - upload
            - skip
            - alias
          - type: 'null'
          title: Action
          description: 'Path-aware mode only (set when the request used ''entries''): what the client should do. ''upload'' = content not present, upload the bytes via /add-document. ''skip'' = a byte-identical file already exists at this exact path, do nothing. ''alias'' = the bytes exist elsewhere; do NOT upload — call /create-alias to hardwire a symlink record instantly (no Azure transfer, no ingest).'
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        azure_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Azure Path
        archived:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Archived
        failed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Failed
        failure_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Reason
          description: Why the document failed (e.g. 'password_protected'). Only set on FAILED_NO_RETRY.
      type: object
      required:
      - hash
      - exists
      title: CheckDuplicateOne
    DocumentTokenEstimateFileRequest:
      properties:
        name:
          type: string
          title: Name
          description: File name including extension.
        tokens:
          type: integer
          minimum: 0.0
          title: Tokens
          description: Text tokens counted locally (o200k_base).
        ocr_pages:
          type: integer
          minimum: 0.0
          title: Ocr Pages
          description: Pages the backend will OCR (no text layer).
          default: 0
        pages:
          type: integer
          minimum: 0.0
          title: Pages
          description: Total page count when known; used for the time estimate.
          default: 0
        total_bytes:
          type: integer
          minimum: 0.0
          title: Total Bytes
          description: File size in bytes; used for the time estimate.
          default: 0
      type: object
      required:
      - name
      - tokens
      title: DocumentTokenEstimateFileRequest
      description: 'One file the desktop uploader has already read and counted.


        ``tokens`` is the text the backend will process, tokenized locally with the same encoder

        ingestion uses. ``ocr_pages`` are pages with no usable text layer (scans, photos); the

        server prices those from its own per-page figure so the constant lives in one place.

        A container (zip, email) is sent as one entry carrying the sum of its members.'
    BatchAddDocumentsRequest:
      properties:
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
          description: Optional task (Conversation) ID to link all documents to.
        lr:
          type: boolean
          title: Lr
          description: Whether task-document links are for legal research.
          default: false
        matter_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Matter Id
          description: Optional matter ID to link all documents to (used when task_id is absent).
        batch_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Batch Id
          description: DocHubUploadBatch ID from batch-start. When set, docs are tracked for batch completion.
        matter_directory_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Matter Directory Id
          description: Optional folder in the MATTER's tree to file the doc into (requires matter_id). Distinct from target_directory_id, which is always a DocHub folder — folder ids do not cross scopes. When set, the doc is placed here explicitly and its DocHub folder ancestry is NOT mirrored into the matter, since the user picked the matter location directly (ENG-19239).
        documents:
          items:
            $ref: '#/components/schemas/BatchAddDocumentItem'
          type: array
          maxItems: 100
          minItems: 1
          title: Documents
