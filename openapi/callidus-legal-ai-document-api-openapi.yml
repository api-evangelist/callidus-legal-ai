      - COMPLAINT
      - STATEMENT_OF_FACTS
      - ANSWER
      - PRIOR_MOTION
      - CONTRACT
      - BRIEF
      - DEMAND_LETTER
      - EXHIBITS
      - OTHER
      - VARIOUS
      - FINANCIAL_DOCUMENT
      - POLICY_DOCUMENT
      - PERSONNEL_RECORD
      - MEETING_MINUTES
      - TESTIMONY_STATEMENT
      - TECHNICAL_DOCUMENT
      - MEDIA_CONTENT
      - EMAIL
      - MEDICAL_RECORD
      - MATTER_MEMORY
      - TASK_MEMORY
      - MATTER_FORM_CACHE
      - MATTER_PREFERENCES
      - PRELIMINARY_ANALYSIS
      - EARLY_INTAKE_MEMORY
      title: DocumentType
      description: Document type classification for matters.
    AddDocumentToTaskResponse:
      properties:
        success:
          type: boolean
          title: Success
        already_linked:
          type: boolean
          title: Already Linked
          default: false
      type: object
      required:
      - success
      title: AddDocumentToTaskResponse
      description: Response for add-document-to-task. Includes whether the link already existed.
    CheckDuplicatesRequest:
      properties:
        files:
          items:
            type: string
          type: array
          title: Files
          description: Legacy hash-only duplicate check. Prefer 'entries' for path-aware detection — with 'files', a byte-identical upload under a different name/folder is reported as a duplicate even though it would now become an independent alias record.
        entries:
          anyOf:
          - items:
              $ref: '#/components/schemas/CheckDuplicateEntry'
            type: array
          - type: 'null'
          title: Entries
          description: 'Path-aware duplicate check (ENG-17767): hash + relative_path per file. When set, ''files'' is ignored.'
      type: object
      title: CheckDuplicatesRequest
    DocumentMetadataSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Document id.
        date_added:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date Added
          description: When the document was added.
        size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size
          description: Size in bytes.
        kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Kind
          description: Mime type (e.g. application/pdf).
        type_label:
          type: string
          title: Type Label
          description: Short display type, e.g. 'pdf'. Derived from the mime type first and the filename extension only as a fallback, so a file uploaded without an extension still shows its real type. Render this rather than parsing the name — the folder listing's type sort uses the same derivation, and parsing the name yourself puts the label out of step with the ordering. Empty only when neither signal is available.
          default: ''
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
          description: Document type / classification (e.g. COMPLAINT, BRIEF, EMAIL). From file_content_type.
        associated_matters:
          items:
            $ref: '#/components/schemas/MatterSummaryWithUser'
          type: array
          title: Associated Matters
          description: Matters this document is linked to (id, name, owner user).
        associated_tasks:
          items:
            $ref: '#/components/schemas/TaskSummaryWithUser'
          type: array
          title: Associated Tasks
          description: Tasks this document is linked to (id, title, module number, owner user).
        name:
          type: string
          title: Name
          description: Original file name (basename).
        original_relative_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Original Relative Path
          description: Folder path the document was uploaded under (e.g. 'bank accounts/2024/statement.pdf'); null if uploaded flat.
        folder_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder Path
          description: Current DocHub folder placement path ending in the filename (e.g. 'bank accounts/statement.pdf'); null when at root. Reflects moves/direct-into-folder uploads, unlike original_relative_path.
        parent_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Parent Id
          description: 'Document this one was extracted from: an archive member''s archive, or an email attachment''s email. Null for a file added on its own.'
        parent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Name
          description: Display name of the parent_id document, when the listing could resolve it. Null when parent_id is null or the parent is not visible to this listing.
        email_provenance:
          anyOf:
          - $ref: '#/components/schemas/EmailProvenance'
          - type: 'null'
          description: 'The email this document was extracted from, as a message rather than a file: sender, recipients, sent date, subject, Message-ID. Populated by the single-document metadata endpoint only — listings omit it to keep the page payload down. Null when the document is not an email attachment, or when its email predates provenance being recorded. Equal to `email_sources[0].provenance` when `email_sources` is non-empty; kept as its own field for clients that only need the one message.'
        email_sources:
          items:
            $ref: '#/components/schemas/EmailSource'
          type: array
          title: Email Sources
          description: 'Every email this document arrived on that the caller may see, not just the first (ENG-22887). A deduplicated attachment is stored once but can have been delivered by several messages. Ordered: the document''s own parent email first — so the head is the message the ''Extracted from'' label names — then oldest *ingested* first, which is send order only for a mailbox synced in order; sort on `provenance.sent_at` if you need true chronology. More than one entry means the file was received more than once. Empty for a document that is not an email attachment, and on listing endpoints, which omit it.'
        email_sources_truncated:
          type: boolean
          title: Email Sources Truncated
          description: True when more emails carried this document than `email_sources` lists (the cap is 25). The count of the remainder is deliberately not reported — it would cost a second query for a number the panel does not need. Always false on listing endpoints.
          default: false
        processed_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Processed Tokens
          description: Tokens ingestion actually produced for this document (the OCR/parse output), from the usage ledger. Null until processing has recorded usage. Lets a client compare its own pre-upload count with what was billed.
        credits_charged:
          anyOf:
          - type: number
          - type: 'null'
          title: Credits Charged
          description: Credits charged for this document across ingestion and summarization, from the usage ledger. Null until recorded.
        user_id:
          type: string
          title: User Id
          description: ID of the user who uploaded the document.
        user:
          anyOf:
          - $ref: '#/components/schemas/UserInfo'
          - type: 'null'
          description: Full user info of the uploader (None if account deleted).
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
          description: Storage path.
        checksum:
          anyOf:
          - type: string
          - type: 'null'
          title: Checksum
          description: Content checksum.
        percent_complete:
          anyOf:
          - type: integer
          - type: 'null'
          title: Percent Complete
          description: Processing progress 0-100.
        source:
          anyOf:
          - $ref: '#/components/schemas/DocumentSource'
          - type: 'null'
          description: 'Origin of the document: ''user'' (uploaded) or ''strongsuit'' (system-generated).'
        can_edit:
          type: boolean
          title: Can Edit
          description: Whether the requesting user can edit (rename, re-categorise, …) this document.
          default: false
        ingestion_status:
          $ref: '#/components/schemas/IngestionStatus'
          description: 'Derived per-doc ingestion status. Projected from DocMetadata.status and the latest INGEST DocHubJob. Values: queued, processing, done, failed, stranded, unknown.'
          default: unknown
        failure_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Reason
          description: Populated when ingestion_status is 'failed'; short machine-readable reason (e.g. 'password_protected').
        archive_members_total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Archive Members Total
          description: 'Archives only: how many files the archive holds, known once extraction has planned its members. Null for ordinary documents and for archives that have not started extracting. NOT cleared when extraction finishes, so a fully processed archive keeps its final total; read it only alongside ingestion_status.'
        archive_members_done:
          anyOf:
          - type: integer
          - type: 'null'
          title: Archive Members Done
          description: 'Archives only: how many members have been registered as documents so far. Climbs while ingestion_status is ''processing''; on ''failed'' it is how many files did land. NOT cleared when extraction finishes, so a processed archive keeps its final n of N — do not read it as ''still extracting'' without checking ingestion_status.'
        already_linked_to_task:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Already Linked To Task
          description: True if this document is already linked to the specified task_id. Only populated when linked_task_id is provided in the request; null otherwise.
      type: object
      required:
      - id
      - name
      - user_id
      title: DocumentMetadataSummary
      description: Abbreviated document metadata for API responses (subset of DocMetadata).
    UploadStateQuery:
      properties:
        blob_path:
          type: string
          maxLength: 1024
          title: Blob Path
          description: Blob name within the caller's own container, as it was uploaded.
        total_bytes:
          type: integer
          minimum: 0.0
          title: Total Bytes
          description: Size the finished blob should be.
        hash:
          type: string
          maxLength: 256
          title: Hash
          description: Type-prefixed content hash (e.g. 'sha1:...'), as written to blob metadata.
      type: object
      required:
      - blob_path
      - total_bytes
      - hash
      title: UploadStateQuery
      description: One blob a client is about to send, or re-send.
    CreateUploadUrlResponse:
      properties:
        upload_url:
          type: string
          title: Upload Url
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
