          description: Display name (e.g. user's filename). When provided, used instead of blob metadata so the client can send arbitrary Unicode in the request body instead of upload headers.
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
          description: Optional task (Conversation) ID to link the document to.
        lr:
          type: boolean
          title: Lr
          description: Whether this task-document link is for legal research.
          default: false
        matter_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Matter Id
          description: Optional matter ID to link the document to.
        source:
          anyOf:
          - $ref: '#/components/schemas/DocumentSource'
          - type: 'null'
          description: 'Origin of the document: ''user'' (uploaded) or ''strongsuit'' (system-generated). Defaults to ''user'' when omitted.'
        chunking_strategy:
          anyOf:
          - type: string
          - type: 'null'
          title: Chunking Strategy
          description: 'Text splitting strategy for ingestion. When set, overrides automatic classification-based splitter selection. Values: ''financial'' (transaction-aware, zero overlap), ''contract'' (default sentence splitter).'
        file_content_type:
          anyOf:
          - $ref: '#/components/schemas/DocumentType'
          - type: 'null'
          description: Document classification (e.g. MATTER_MEMORY, TASK_MEMORY). When provided, bypasses LLM classification during ingestion.
        purpose:
          anyOf:
          - $ref: '#/components/schemas/DocumentPurpose'
          - type: 'null'
          description: Intended use of this upload. When set to 'template', the file is content-sniffed and rejected unless it's a genuine .docx (ENG-17640). Omit for ordinary document uploads — this never restricts those.
        archive_member_names_url_encoded:
          type: boolean
          title: Archive Member Names Url Encoded
          description: Set when this upload is an archive whose member names were percent-encoded by the producer (e.g. a Dropbox folder-download zip). Extraction decodes member names before registering the children.
          default: false
        archive_member_path_prefix:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Archive Member Path Prefix
          description: Folder path to nest this archive's extracted members under, so the archive itself can sit beside the folder it produces instead of inside it (e.g. a Dropbox folder-download zip, whose members carry no wrapping directory of their own).
        relative_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Relative Path
          description: Folder-relative path from a folder upload (e.g. 'Taxes/2024/w2.pdf'), typically the browser's webkitRelativePath. Its directory part builds the user's DocHub folder tree and the basename becomes the display name. If omitted but original_filename contains '/', it is split as a fallback.
        target_directory_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Target Directory Id
          description: Optional DocHub folder to upload into (the 'current folder'); defaults to root. Any relative_path is created beneath it.
        matter_directory_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Matter Directory Id
          description: Optional folder in the MATTER's tree to file the doc into (requires matter_id). Distinct from target_directory_id, which is always a DocHub folder — folder ids do not cross scopes. When set, the doc is placed here explicitly and its DocHub folder ancestry is NOT mirrored into the matter, since the user picked the matter location directly (ENG-19239).
        total_bytes:
          type: integer
          minimum: 0.0
          title: Total Bytes
          description: File size in bytes for pre-registration credit estimation (0 = per-doc floor).
          default: 0
        pages:
          type: integer
          minimum: 0.0
          title: Pages
          description: Known page count for pre-registration credit estimation (0 if unknown).
          default: 0
