    FolderSortField:
      type: string
      enum:
      - name
      - date_added
      - category
      - added_by
      - type
      title: FolderSortField
      description: "Sortable fields for the folder listing (ENG-19278).\n\nDeliberately not the same set as ``DocumentSortField``: ``size`` isn't a column in the\nfolder browser, while ``added_by`` and ``type`` are. Matters/Tasks are absent on purpose —\nthose names are encrypted at rest, so ordering on them would sort ciphertext.\n\nFolders are sorted together with files, never pinned above them. How a folder places depends\non whether it has a value for the field:\n\n- ``NAME``, ``DATE_ADDED`` — a folder has its own name and ``created_at``, so it interleaves\n  with files on equal footing.\n- ``TYPE`` — a folder sorts as the literal ``\"folder\"``, so it interleaves alphabetically\n  among file extensions (``docx`` < ``folder`` < ``pdf``).\n- ``CATEGORY``, ``ADDED_BY`` — a folder has neither, so it carries NULL and pins to the top\n  in *both* directions (see ``_merged_order_by``)."
