          title: Select All Folder Id
          description: Scope select_all to a specific folder subtree. Only effective when select_all is true.
        exclude_doc_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 5000
          title: Exclude Doc Ids
          description: 'Doc IDs to exclude from select_all. Used for the mode+delta selection model: the user selected all, then unchecked a few items. Bounded by user clicks (max 5000). Only effective when select_all is true.'
        exclude_folder_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 500
          title: Exclude Folder Ids
          description: Folder IDs to exclude from select_all. The server resolves each folder's subtree and excludes all contained docs. Bounded by user clicks (max 500). Only effective when select_all is true.
        prune_empty_folders:
          type: boolean
          title: Prune Empty Folders
          description: If true, once the background purge finishes, delete the folders these documents vacated (and their ancestors) if they are left empty. Runs at the tail of the delete job, so it can't race the async purge, and never touches unrelated empty folders.
          default: false
      type: object
      title: DeleteDocumentsRequest
      description: 'Request for POST delete-documents: hard-delete a batch of documents owned by the caller.


        Accepts ``folder_ids`` (resolved server-side to all files in the subtree) and/or

        ``document_ids`` (loose files). At least one must be non-empty. When ``folder_ids``

        is provided, ``matter_id`` scopes the resolution; omit it for DocHub scope.


        Backward-compatible: the old ``document_ids``-only shape still works unchanged.'
