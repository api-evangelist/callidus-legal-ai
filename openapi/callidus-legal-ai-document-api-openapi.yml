      - matter_id
      title: AddDocumentToMatterRequest
    EmailSource:
      properties:
        document_id:
          type: string
          format: uuid
          title: Document Id
          description: Doc Hub id of the email document itself.
        name:
          type: string
          title: Name
          description: The email document's display name (its stored .eml filename).
        provenance:
          $ref: '#/components/schemas/EmailProvenance'
          description: That email's own headers. Fields the message did not carry are null/empty.
      type: object
      required:
      - document_id
      - name
      - provenance
      title: EmailSource
      description: 'One email a document arrived on, as the details panel lists it (ENG-22887).


        A deduplicated attachment is stored once but can have arrived on several

        emails; each of them recorded the document id it resolved to, and that is the

        only record the file came more than once. Listing them is what lets a matter

        trace the file back to every message that delivered it, rather than to

        whichever one happened to be resolved first.


        ``document_id`` is the email''s own Doc Hub document, so a client can open it.'
