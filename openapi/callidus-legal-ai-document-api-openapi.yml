      - label
      - count
      title: FilterOption
      description: Single option in a faceted filter (value, display label, count).
    MoveSkipReason:
      type: string
      enum:
      - name_conflict
      - batch_name_conflict
      - redundant_descendant
      - too_deep
      - cycle
      - already_there
      - not_at_source
      title: MoveSkipReason
      description: 'Why one selected item did not move (ENG-19224).


        Collisions are refused, never resolved: nothing is overwritten, merged, deleted, or unlinked by

        a move. Every obstruction is one of these, so a caller renders them from a single flat list.'
    DocumentType:
      type: string
