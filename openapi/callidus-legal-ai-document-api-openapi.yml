          description: Optional task (Conversation) ID to link the document to.
        file_content_type:
          anyOf:
          - $ref: '#/components/schemas/DocumentType'
          - type: 'null'
          description: Document classification (e.g. MATTER_MEMORY, TASK_MEMORY). When provided, bypasses LLM classification during ingestion.
        purpose:
          anyOf:
          - $ref: '#/components/schemas/DocumentPurpose'
          - type: 'null'
          description: Intended use of this upload. When set to 'template', the file is content-sniffed and rejected unless it's a genuine .docx (ENG-17640). Omit for ordinary document uploads — this never restricts those.
        relative_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Relative Path
          description: Folder-relative path from a folder upload (e.g. 'Taxes/2024/w2.pdf'). Its directory part builds the user's DocHub folder tree and the basename becomes the display name. If omitted but original_filename contains '/', it is split as a fallback.
        target_directory_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Target Directory Id
          description: Optional DocHub folder to upload into (the 'current folder'); defaults to root. Any relative_path is created beneath it.
        matter_directory_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Matter Directory Id
          description: 'Optional folder in the MATTER''s tree to file the doc into (requires matter_id). Distinct from target_directory_id, which is always a DocHub folder — folder ids do not cross scopes. When set, the doc is placed here explicitly and its DocHub folder ancestry is NOT mirrored into the matter, since the user picked the matter location directly (ENG-19239). NOTE: resolved batch-wide like matter_id — the request-level value wins, else the first item that sets one, and it then applies to EVERY doc in the batch. Per-item folders are not supported; send separate batches if files need different matter folders.'
        total_bytes:
          type: integer
          minimum: 0.0
          title: Total Bytes
          description: File size in bytes for pre-registration credit estimation (0 = per-doc floor).
          default: 0
        pages:
          type: integer
          minimum: 0.0
          title: Pages
          description: Known page count for pre-registration credit estimation (0 if unknown).
          default: 0
