          description: Display name (e.g. user's filename).
        source:
          anyOf:
          - $ref: '#/components/schemas/DocumentSource'
          - type: 'null'
          description: 'Origin of the document: ''user'' (uploaded) or ''strongsuit'' (system-generated). Defaults to ''user'' when omitted.'
        chunking_strategy:
          anyOf:
          - type: string
          - type: 'null'
