            type: integer
          type: object
          title: By Status
          description: DocMetadata.status -> row count inside the window.
        first_upload:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: First Upload
        last_upload:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Upload
      type: object
