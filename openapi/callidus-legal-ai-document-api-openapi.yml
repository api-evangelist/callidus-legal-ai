          type: boolean
          title: Archive Member Names Url Encoded
          description: Set when this upload is an archive whose member names were percent-encoded by the producer (e.g. a Dropbox folder-download zip). Extraction decodes member names before registering the children.
          default: false
        archive_member_path_prefix:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Archive Member Path Prefix
          description: Folder path to nest this archive's extracted members under, so the archive itself can sit beside the folder it produces instead of inside it (e.g. a Dropbox folder-download zip, whose members carry no wrapping directory of their own).
