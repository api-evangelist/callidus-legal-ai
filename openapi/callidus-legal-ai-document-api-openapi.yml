          description: False when some documents were left behind — an archive still being extracted is refused rather than purged (ENG-22114). Compare deleted_count with the names requested to see how many.
        deleted_count:
          type: integer
          title: Deleted Count
          description: Number of doc_metadata rows deleted.
      type: object
      required:
