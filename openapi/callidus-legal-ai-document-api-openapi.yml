    DeletionImpactResponse:
      properties:
        total_file_count:
          type: integer
          title: Total File Count
          description: Distinct files affected (deduped across placements).
          default: 0
        matters:
          items:
            $ref: '#/components/schemas/AffectedMatter'
          type: array
          title: Matters
          description: Distinct matters any affected file is linked to; [] if none.
      type: object
      title: DeletionImpactResponse
      description: 'Result for POST deletion-impact: read-only; mutates nothing.


        ``total_file_count`` is every file under the folders (recursive) plus the loose

        files, de-duped across multi-placements. ``matters`` is the union of distinct

        matters any affected file is linked to (empty if none) — so the UI can warn that

        deleting also removes those files from the listed matters.'
    SelectAllSharedCountResponse:
