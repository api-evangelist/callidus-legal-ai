    SearchScope:
      type: string
      enum:
      - subtree
      - current
      title: SearchScope
      description: "How deep a folder-listing query reaches (ENG-23085).\n\nQuery mode (any ``search`` or file filter) flattens the listing into a match set. This\nchooses what that set spans:\n\n- ``SUBTREE`` — matches at and below ``folder_id`` (the whole scope at root). The default,\n  and the only behaviour before this flag existed, so an absent param is a no-op.\n- ``CURRENT`` — matches placed directly at ``folder_id``: its immediate child folders and\n  the files at that level, nothing deeper.\n\nThe endpoint holds no policy about which affordance maps to which value — the frontend\nsends ``CURRENT`` for filter chips and ``SUBTREE`` for search (ENG-23088). Keeping the\nmapping there means a scope control, if one is ever wanted, overrides this param without\na backend change.\n\nThe restriction is applied in the query, never after paging: a page filtered post-hoc\nwould render short or empty and make ``has_next`` describe rows the caller never sees."
