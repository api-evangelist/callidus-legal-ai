      description: 'Response for POST clear-docs: hard-deletes matching documents owned by the user.'
    DocumentCreditsResponse:
      properties:
        credits:
          type: integer
          title: Credits
          description: Total credits used for document processing in the requested window.
      type: object
      required:
      - credits
      title: DocumentCreditsResponse
      description: 'Response for GET /document/credits: Doc Hub processing credits for a month or ``since`` window.'
    FilterOption:
      properties:
        value:
          type: string
          title: Value
        label:
          type: string
          title: Label
        count:
          type: integer
          title: Count
      type: object
      required:
