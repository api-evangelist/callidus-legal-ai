          format: uuid
          title: Batch Id
          description: Batch ID from /add-documents-v2.
      type: object
      required:
      - batch_id
      title: PollDocumentsV2Request
      description: Request for POST /document/poll-documents-v2.
    MoveDocumentRequest:
      properties:
        doc_id:
          type: string
          format: uuid
          title: Doc Id
          description: Document to move
        target_folder_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Target Folder Id
          description: Destination folder; null/omit for root
        source_folder_id:
          anyOf:
