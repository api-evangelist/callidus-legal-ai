    EmailProvenance:
      properties:
        subject:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject
          description: The email's Subject header.
        sender:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender
          description: From header, as 'Display Name <address>' when the message carried both.
        to:
          items:
            type: string
          type: array
          title: To
          description: To recipients, as 'Display Name <address>'. Capped at 25; a longer list is truncated.
        cc:
          items:
            type: string
          type: array
          title: Cc
          description: Cc recipients, same shape and cap as `to`.
        sent_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Sent At
          description: The Date header, as an ISO 8601 string. A string rather than a timestamp because a sender whose client wrote a malformed date is passed through verbatim rather than dropped — parse it if you can, otherwise render it as text.
        message_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Message Id
          description: RFC 5322 Message-ID, angle brackets included. The same value in every mailbox holding a copy.
      type: object
      title: EmailProvenance
      description: 'The message an attachment arrived on (ENG-22885).


        Recorded on the email document when its attachments were extracted, and read

        here through ``parent_id``. Every field is optional because it mirrors the

        headers the message actually carried: an email with no ``Cc`` has none, and a

        message whose headers could not be decoded has nothing at all.


        Absent entirely for a file that is not an email attachment, and for one whose

        email was ingested before the extractor recorded provenance — re-ingesting

        that email fills it in.'
