openapi: 3.2.0
info:
  title: CallidusAI Document API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Document
paths:
  /document/redlines:
    post:
      summary: Optp Redlines
      operationId: optp_redlines_document_redlines_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_optp_redlines_document_redlines_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Document
  /document/export:
    post:
      summary: Optp Export
      operationId: optp_export_document_export_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_optp_export_document_export_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Document
  /document/upload-url:
    post:
      tags:
      - Document
      summary: Create Document Upload Url
      description: 'Return a short-lived SAS URL the client can use to upload a document.


        Container name follows: storage.get_container_name(user_id), i.e. document-

        Storage account: filesystembeta (or AZURE_STORAGE_* fallback)


        Client should upload via HTTP PUT to the returned URL.'
      operationId: create_document_upload_url_document_upload_url_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUploadUrlResponse'
  /document/upload-state:
    post:
      tags:
      - Document
      summary: Get Upload State
      description: 'What storage already holds for blobs the caller is about to send.


        A desktop upload interrupted by a closed laptop has two ways of having done

        work that must not be repeated: a file whose bytes all arrived but whose

        manifest never did, and a large file staged in blocks partway through. Both

        questions are reads against blob storage.


        Answered here rather than by the client so the upload SAS stays write-only.

        A token that can read is a token that can take a customer''s documents if it

        leaks, and an interrupted upload is not worth that. This endpoint uses the

        API''s own credentials and answers only about the caller''s own container --

        the path is a blob name within it, so there is nothing to scope wrong.


        Every failure answers "we do not know", which sends the file. Sending

        something already there costs a transfer; skipping something that is not

        costs the document.'
      operationId: get_upload_state_document_upload_state_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadStateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/add-document:
    post:
      tags:
      - Document
      summary: Add Document
      description: 'Add document metadata to the user''s document list in the filesystem.


        If task_id or matter_id is provided but the link fails (e.g. permission or not found),

        the document is still added and a 200 response is returned; task_linked or matter_linked

        in the response will be False so the caller can detect and handle the partial failure.'
      operationId: add_document_document_add_document_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocumentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /document/batch-start:
    post:
      tags:
      - Document
      summary: Batch Start
      description: 'Declare an upload batch for a dataset task.


        Creates a DocHubUploadBatch row with no docs enrolled yet.

        Returns the batch_id for the frontend to pass on each subsequent upload call.'
      operationId: batch_start_document_batch_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchStartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStartResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/batch-finalize:
    post:
      tags:
      - Document
      summary: Batch Finalize
      description: 'Seal an upload batch with the true count of registered docs (ENG-16159).


        The frontend calls this when its upload loop ends so completion gates on the real

        manifest size — reconciling any file that failed to upload. Re-checks completion in

        case every doc already drained before the seal arrived.'
      operationId: batch_finalize_document_batch_finalize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFinalizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchFinalizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/add-documents:
    post:
      tags:
      - Document
      summary: Add Documents Batch
      description: 'Batch-register multiple uploaded documents.


        Each document is registered independently — a failure on one item does not

        block the others. The response array is in the same order as the request.

        After registration, all successful documents are bulk-linked to the

        task/matter in a single operation.'
      operationId: add_documents_batch_document_add_documents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAddDocumentsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAddDocumentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/add-documents-v2:
    post:
      tags:
      - Document
      summary: Add Documents V2
      description: 'Fire-and-forget document registration from a manifest blob (ENG-21063).


        The frontend uploads files to Azure, writes a JSON manifest listing them,

        then calls this endpoint. A Temporal workflow handles registration in the

        background — the user can disconnect immediately.'
      operationId: add_documents_v2_document_add_documents_v2_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentsV2Request'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocumentsV2Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/poll-documents-v2:
    post:
      tags:
      - Document
      summary: Poll Documents V2
      description: 'Poll registration and processing status for a v2 upload batch.


        Returns aggregate counts by status plus up to 3 sample documents per

        category for the frontend progress display.'
      operationId: poll_documents_v2_document_poll_documents_v2_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollDocumentsV2Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollDocumentsV2Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/cancel-upload-v2:
    post:
      tags:
      - Document
      summary: Cancel Upload V2
      description: 'Cancel all documents in a v2 upload batch.


        Finds all docs by batch_id, cancels their jobs, unlinks from task/matter,

        archives them, and cleans up ediscovery state. Reuses the same logic as

        POST /cancel-upload but operates by batch_id instead of individual doc IDs.'
      operationId: cancel_upload_v2_document_cancel_upload_v2_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelUploadV2Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelUploadV2Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/batch/{batch_id}/documents:
    get:
      tags:
      - Document
      summary: Batch Documents
      description: 'Return paginated document IDs and names for a v2 upload batch.


        Called by the frontend upload pipeline after poll-documents-v2 reports

        completion, so it can populate real doc IDs for downstream consumers

        (task linking, SmartBot, LR intake, etc.).'
      operationId: batch_documents_document_batch__batch_id__documents_get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Batch Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDocumentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/get-document-metadata:
    get:
      tags:
      - Document
      summary: Get Document Metadata
      description: 'Get document metadata summary for a single document.


        Allowed if the user is the document owner or has can_view on a matter the document is linked to.'
      operationId: get_document_metadata_document_get_document_metadata_get
      parameters:
      - name: document_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/poll-documents:
    post:
      tags:
      - Document
      summary: Poll Documents
      description: 'Poll document progress by ID.


        Returns document id, status, size, and percent_complete for documents the user can view

        (owner or has can_view on a linked matter). Documents not found or not accessible

        are omitted from the response.'
      operationId: poll_documents_document_poll_documents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollDocumentsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollDocumentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/list:
    get:
      tags:
      - Document
      summary: List Documents
      description: Paginated, filterable document listing. Replaces list-all-documents.
      operationId: list_documents_document_list_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 1-indexed page number.
          default: 1
          title: Page
        description: 1-indexed page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page.
          default: 25
          title: Page Size
        description: Items per page.
      - name: view
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DocumentListView'
          description: Tab scope.
          default: all
        description: Tab scope.
      - name: categories
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by file_content_type.
          default: []
          title: Categories
        description: Filter by file_content_type.
      - name: types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by listing type key (pdf, docx, ...), Folder or Unknown.
          default: []
          title: Types
        description: Filter by listing type key (pdf, docx, ...), Folder or Unknown.
      - name: matter_ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by linked matter IDs.
          default: []
          title: Matter Ids
        description: Filter by linked matter IDs.
      - name: module_types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by module type numeric keys.
          default: []
          title: Module Types
        description: Filter by module type numeric keys.
      - name: added_by_user_ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by uploader user IDs.
          default: []
          title: Added By User Ids
        description: Filter by uploader user IDs.
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only docs uploaded at or after this instant.
          title: Date From
        description: Only docs uploaded at or after this instant.
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only docs uploaded at or before this instant.
          title: Date To
        description: Only docs uploaded at or before this instant.
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive text search.
          title: Search
        description: Case-insensitive text search.
      - name: filenames_only
        in: query
        required: false
        schema:
          type: boolean
          description: When true, search matches only file names (not matter/task names or content type).
          default: false
          title: Filenames Only
        description: When true, search matches only file names (not matter/task names or content type).
      - name: sort_by
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DocumentSortField'
          description: Sort field.
          default: date_added
        description: Sort field.
      - name: sort_order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          description: Sort direction.
          default: desc
        description: Sort direction.
      - name: target_user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Enterprise delegation.
          title: Target User Id
        description: Enterprise delegation.
      - name: linked_task_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: When provided, each doc includes already_linked_to_task boolean.
          title: Linked Task Id
        description: When provided, each doc includes already_linked_to_task boolean.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/filter-options:
    get:
      tags:
      - Document
      summary: Get Filter Options
      description: Return available filter values with counts for faceted search.
      operationId: get_filter_options_document_filter_options_get
      parameters:
      - name: view
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DocumentListView'
          description: Tab scope.
          default: all
        description: Tab scope.
      - name: categories
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by file_content_type.
          default: []
          title: Categories
        description: Filter by file_content_type.
      - name: types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by listing type key (pdf, docx, ...), Folder or Unknown.
          default: []
          title: Types
        description: Filter by listing type key (pdf, docx, ...), Folder or Unknown.
      - name: matter_ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by linked matter IDs.
          default: []
          title: Matter Ids
        description: Filter by linked matter IDs.
      - name: module_types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by module type numeric keys.
          default: []
          title: Module Types
        description: Filter by module type numeric keys.
      - name: added_by_user_ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by uploader user IDs.
          default: []
          title: Added By User Ids
        description: Filter by uploader user IDs.
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only docs uploaded at or after this instant.
          title: Date From
        description: Only docs uploaded at or after this instant.
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only docs uploaded at or before this instant.
          title: Date To
        description: Only docs uploaded at or before this instant.
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive text search.
          title: Search
        description: Case-insensitive text search.
      - name: target_user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Enterprise delegation.
          title: Target User Id
        description: Enterprise delegation.
      - name: dochub_only
        in: query
        required: false
        schema:
          type: boolean
          description: Scope to user's own docs only (DocHub folder listing context). Bypasses the 3-way UNION.
          default: false
          title: Dochub Only
        description: Scope to user's own docs only (DocHub folder listing context). Bypasses the 3-way UNION.
      - name: include_folders
        in: query
        required: false
        schema:
          type: boolean
          description: 'Prepend ''Folder'' to the Type options, counting the folders in the browsed tree. Only the folder browser should set this: the flat /document/list has no folder rows.'
          default: false
          title: Include Folders
        description: 'Prepend ''Folder'' to the Type options, counting the folders in the browsed tree. Only the folder browser should set this: the flat /document/list has no folder rows.'
      - name: folder_matter_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: With include_folders, count the folders of this matter's tree instead of the caller's DocHub tree. Same semantics as matter_id on GET /document/folders.
          title: Folder Matter Id
        description: With include_folders, count the folders of this matter's tree instead of the caller's DocHub tree. Same semantics as matter_id on GET /document/folders.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFilterOptionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/list-all-documents:
    get:
      tags:
      - Document
      summary: List All Documents
      description: 'List all documents the user can access.


        Includes:

        - Documents the user owns (doc_metadata.user_id == user_id)

        - Documents linked to matters the user can access (via matter_docs)

        - Documents linked to tasks the user can access (via task_docs)'
      operationId: list_all_documents_document_list_all_documents_get
      deprecated: true
      parameters:
      - name: target_user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional target user id. If omitted, defaults to the authenticated user.
          title: Target User Id
        description: Optional target user id. If omitted, defaults to the authenticated user.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          description: Max number of documents to return.
          default: 5000
          title: Limit
        description: Max number of documents to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of documents to skip for pagination.
          default: 0
          title: Offset
        description: Number of documents to skip for pagination.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDocumentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/get-documents-by-task:
    get:
      tags:
      - Document
      summary: Get Documents By Task
      description: 'Get all documents associated with a task (Conversation). Requires can_view on the task.


        ``FAILED_NO_RETRY`` docs are filtered out by default; pass ``include_failed_no_retry=true``

        when the caller needs to surface per-file failure reasons in the UI (e.g. Case Timeline

        "Analysis skipped" state — ENG-11670).


        Optional ``limit``/``offset`` enable pagination. When ``limit`` is set the response

        includes ``total_count`` for paging controls; when omitted the full list is returned

        (backward-compatible default).


        Optional ``search``, ``categories``, ``module_types``, ``exclude_ids``,

        ``sort_by``, and ``sort_order`` mirror the ``/list`` endpoint filters.'
      operationId: get_documents_by_task_document_get_documents_by_task_get
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: string
          title: Task Id
      - name: include_failed_no_retry
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Failed No Retry
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Max documents to return (omit for all)
          title: Limit
        description: Max documents to return (omit for all)
      - name: offset
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Number of documents to skip (requires limit)
          title: Offset
        description: Number of documents to skip (requires limit)
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive text search on file name.
          title: Search
        description: Case-insensitive text search on file name.
      - name: categories
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by file_content_type.
          default: []
          title: Categories
        description: Filter by file_content_type.
      - name: module_types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by module type.
          default: []
          title: Module Types
        description: Filter by module type.
      - name: exclude_ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Exclude specific document IDs.
          default: []
          title: Exclude Ids
        description: Exclude specific document IDs.
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - user
            - strongsuit
            type: string
          - type: 'null'
          description: Filter by document source.
          title: Source
        description: Filter by document source.
      - name: sort_by
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DocumentSortField'
          description: Sort field.
          default: date_added
