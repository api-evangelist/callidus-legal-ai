    delete:
      tags:
      - Document
      summary: Delete Folder Endpoint
      description: 'Delete a folder and cascade its contents. Matter: un-associate the subtree''s docs

        from the matter (docs survive in DocHub). DocHub: tombstone files whose only home is

        the subtree (they vanish from listings immediately) and purge them in the background

        via BulkDeleteWorkflow — restart-safe and non-blocking even for folders with thousands

        of files; files also filed elsewhere are untagged. Empty folders just drop the row.


        ``prune_empty_folders`` additionally clears the folders this delete left empty — the

        deleted folder''s ancestor chain, plus the matter folders its files vacated — never

        unrelated empty folders elsewhere in the scope (ENG-21711). Matter scope prunes inline

        (synchronous); DocHub scope prunes after the background purge drains (so it can''t race

        the async doc removal). The UI should confirm against the listing''s `total_file_count`

        first. Requires edit on the scope.'
      operationId: delete_folder_endpoint_document_folders__folder_id__delete
      parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Folder Id
      - name: matter_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Matter Id
      - name: prune_empty_folders
        in: query
        required: false
        schema:
          type: boolean
          description: Also delete the deleted folder's ancestors if this delete left them with no files.
          default: false
          title: Prune Empty Folders
        description: Also delete the deleted folder's ancestors if this delete left them with no files.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFolderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
