      summary: Delete Documents
      description: 'Tombstone a batch of the caller''s documents and kick the durable background

        purge (ENG-17809).


        Accepts ``folder_ids`` (resolved server-side to all files in the subtree) and/or

        loose ``document_ids``. Returns immediately: eligible docs flip to ``deleting``

        (they disappear from all listings at once) and a Temporal workflow purges them —

        blobs, vectors, DB rows — in the background, resumable across worker restarts.

        Non-owned/missing docs, and archives still being extracted (ENG-22114), are

        reported in ``failed``. Progress is available via ``GET /delete-status``.'
      operationId: delete_documents_document_delete_documents_post
      requestBody:
