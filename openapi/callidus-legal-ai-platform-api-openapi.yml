          title: Doc Ids
          description: Allowlist of DocHub doc IDs the doc-search tool is restricted to. ``None`` applies no allowlist (tool searches its full default scope). An empty list yields zero retrieval candidates.
        include_memory:
          type: boolean
          title: Include Memory
          description: When False, the iteration-0 preload is skipped entirely — no MATTER_MEMORY, TASK_MEMORY, conversation messages, matter markdown, or doc summaries. Synthesis grounds purely on retrieval results. Used by the task-only path to enforce no matter-level context leakage.
          default: true
        retrieval_preset:
          type: string
          enum:
          - legacy
          - narrow
          - standard
          - wide
          title: Retrieval Preset
          description: Deep search defaults to the 'wide' retrieval-budget preset (see SearchConfig.retrieval_preset).
          default: wide
        retrieval_budget:
          anyOf:
          - $ref: '#/components/schemas/RetrievalBudget'
          - type: 'null'
          description: Explicit retrieval budget override, e.g. for evals/debug. Takes precedence over `retrieval_preset` when the `context_engine_luna_models` flag is on; ignored (like `retrieval_preset`) when it is off.
        analysis_model:
          type: string
          title: Analysis Model
          description: OpenAI model used for combined relevance/sufficiency/refinement analysis.
          default: gpt-4.1-mini
        synthesis_model:
          type: string
          title: Synthesis Model
          description: Gemini model used to synthesize the grounded answer with numbered citations.
          default: gemini-3-flash-preview
        min_iterations:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Min Iterations
          default: 3
        max_iterations:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Max Iterations
          default: 6
        max_output_tokens:
          type: integer
          maximum: 32000.0
          minimum: 256.0
          title: Max Output Tokens
          default: 24000
        output_format:
          type: string
          enum:
          - md
          - json
          title: Output Format
          description: Synthesis output format. ``md`` (default) returns a markdown answer with inline ``[N]`` citations; ``json`` returns a strict-schema ``StructuredAnswer`` populated under ``structured_answer`` with an empty ``answer`` string.
          default: md
        include_evidence:
          type: boolean
          title: Include Evidence
          description: When True (default), the response includes the numbered evidence blocks that ground the answer and synthesis is instructed to cite them. When False, evidence is still used internally for grounding but the response ``evidence`` field is ``[]``, the synthesis prompt does NOT instruct citation usage, and any leaked citation markers are stripped from the answer.
          default: true
      additionalProperties: false
      type: object
      title: DeepSearchConfig
