openapi: 3.2.0
info:
  title: CallidusAI Platform API
  description: Callidus AI backend API
  version: 0.1.0
tags:
- name: Platform
paths:
  /platform/admin/users/{target_user_id}/purge-work-data:
    post:
      tags:
      - Platform
      summary: Purge User Work Data Route
      description: 'Delete Doc Hub, blobs, eDiscovery, analytics, and related work data.


        Does not delete ``model_usage_ledger`` (retained for cost of deleted users).


        Postgres and eDiscovery commits run **before** blob-container and vector-table

        deletes so a failed commit cannot leave DB rows pointing at storage that

        already gone. The two commits are independent databases (no 2PC): if

        ``db.commit()`` succeeds and ``ediscovery_db.commit()`` fails, Postgres work

        data is already gone and a retry is idempotent. The response is 200 only

        after both commits and the external deletes succeed.'
      operationId: purge_user_work_data_route_platform_admin_users__target_user_id__purge_work_data_post
      parameters:
      - name: target_user_id
        in: path
        required: true
        schema:
          type: string
          title: Target User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeWorkDataResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/tasks/{task_id}/audit-logs:
    post:
      tags:
      - Platform
      summary: Create Audit Log
      description: 'Create a new audit log entry for a task.


        Requires can_edit permission on the conversation or legal research session.'
      operationId: create_audit_log_platform_tasks__task_id__audit_logs_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAuditLogCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAuditLogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Platform
      summary: List Audit Logs
      description: 'List audit log entries for a task.


        Requires can_view permission on the conversation or legal research session.'
      operationId: list_audit_logs_platform_tasks__task_id__audit_logs_get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: module_type
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Module Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAuditLogListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/feature-flags/:
    get:
      tags:
      - Platform
      summary: List Feature Flags
      operationId: list_feature_flags_platform_feature_flags__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FeatureFlagResponse'
                type: array
                title: Response List Feature Flags Platform Feature Flags  Get
    post:
      tags:
      - Platform
      summary: Create Feature Flag
      operationId: create_feature_flag_platform_feature_flags__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/feature-flags/{key}:
    put:
      tags:
      - Platform
      summary: Update Feature Flag
      operationId: update_feature_flag_platform_feature_flags__key__put
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Platform
      summary: Delete Feature Flag
      operationId: delete_feature_flag_platform_feature_flags__key__delete
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Platform
      summary: Get Feature Flag Value
      description: 'Return the raw value for a given flag key.


        Any authenticated user can call this endpoint.

        Returns 404 if the flag does not exist.'
      operationId: get_feature_flag_value_platform_feature_flags__key__get
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagValueResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/matters/{matter_id}/billing/:
    get:
      tags:
      - Platform
      summary: List Billable Hours Entries Endpoint
      description: List all billable hours entries for a matter with per-user aggregates.
      operationId: list_billable_hours_entries_endpoint_platform_matters__matter_id__billing__get
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillableHoursListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Platform
      summary: Create Billable Hours Entry Endpoint
      description: 'Create a new billable hours entry for the authenticated user.


        If an entry already exists for the same date, its hours are overwritten.

        Returns 201 for new entries, 200 for overwrites.'
      operationId: create_billable_hours_entry_endpoint_platform_matters__matter_id__billing__post
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBillableHoursRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillableHoursEntryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
