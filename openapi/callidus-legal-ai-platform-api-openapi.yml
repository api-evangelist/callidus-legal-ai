      description: 'Restart a case analysis workflow with the specified mode.


        Modes:

        - from_scratch: reset all analysis tasks and rerun from the beginning.

        - from_subtask: reset the specified task and all downstream tasks; skip completed upstream.

        - resume_from_failure: reset only failed tasks; skip all completed tasks.

        - brief_only: reset nothing; skip every completed task and regenerate the case brief.'
      operationId: restart_case_analysis_platform_matters_case_analysis_admin__analysis_id__restart_post
      parameters:
      - name: analysis_id
        in: path
        required: true
