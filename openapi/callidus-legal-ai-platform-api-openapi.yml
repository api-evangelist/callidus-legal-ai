      operationId: team_billable_hours_summary_endpoint_platform_matters__matter_id__billing_team__get
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      responses:
        '200':
          description: Successful Response
