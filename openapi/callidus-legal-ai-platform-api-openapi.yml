      tags:
      - Platform
      summary: Stop Case Analysis
      description: 'Stop a running case analysis: cancel/terminate its executions and write DB truth now.


        Cancel only lands on the next activity heartbeat; pass ``force=true`` to

        terminate immediately instead. Either way, any RUNNING task is

        immediately flipped to FAILED (error="Stopped by admin") so the UI

        doesn''t lag the cancel/terminate call. Idempotent — stopping an analysis

        with no live executions is a no-op on the Temporal side.'
      operationId: stop_case_analysis_platform_matters_case_analysis_admin__analysis_id__stop_post
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
