      summary: User Billable Hours Aggregates Endpoint
      description: Return the authenticated user's cross-matter billable hours aggregates.
      operationId: user_billable_hours_aggregates_endpoint_platform_billing__get
      parameters:
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
