        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/context-engine/{matter_id}/debug:
    get:
      tags:
      - Platform
      summary: Memory Debug
      description: 'Return diagnostic info: gate state, cache freshness, and doc-hub metadata.'
      operationId: memory_debug_platform_context_engine__matter_id__debug_get
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDebugInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/context-engine/{matter_id}/reset-cache:
    post:
      tags:
      - Platform
      summary: Reset Memory Cache
      description: Archive doc-hub MATTER_MEMORY documents and clear the JSONB cache so the next run forces a full rebuild.
      operationId: reset_memory_cache_platform_context_engine__matter_id__reset_cache_post
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Reset Memory Cache Platform Context Engine  Matter Id  Reset Cache Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/context-engine/{matter_id}:
    post:
      tags:
      - Platform
      summary: Context Engine
      description: 'Unified context engine: fast synthesis or search pipeline.'
      operationId: context_engine_platform_context_engine__matter_id__post
      parameters:
      - name: matter_id
        in: path
        required: true
        schema:
          type: string
          title: Matter Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/FastModeConfig'
              - $ref: '#/components/schemas/SearchModeConfig'
              - $ref: '#/components/schemas/DeepSearchModeConfig'
              discriminator:
                propertyName: mode
                mapping:
                  fast: '#/components/schemas/FastModeConfig'
                  search: '#/components/schemas/SearchModeConfig'
                  deep_search: '#/components/schemas/DeepSearchModeConfig'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/UnifiedFastResult'
                - $ref: '#/components/schemas/UnifiedSearchResult'
                title: Response Context Engine Platform Context Engine  Matter Id  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/context-engine/task/{task_id}:
    post:
      tags:
      - Platform
      summary: Task Context Engine
      description: 'Task-scoped context engine (search mode).


        When matter intelligence is on for this task (``Matter.memory_enabled``

        AND not ``Conversation.matter_memory_override``), runs the full matter

        search pipeline. Otherwise runs the search pipeline scoped to the task''s

        DocHub documents only, with no memory preload — see

        ``run_task_context_engine`` for the enforcement details.'
      operationId: task_context_engine_platform_context_engine_task__task_id__post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchModeConfig'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedSearchResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/credits/used:
    get:
      tags:
      - Platform
      summary: Get Credits Used Endpoint
      description: 'Return total credits consumed for the specified month.


        When called without ``?target_user_id=``, returns credits for the

        authenticated caller. When ``?target_user_id=`` is provided,

        the caller must have internal Callidus admin (``callidus-admin`` or

        ``strongsuit-god``) or enterprise ``admin`` role.


        Query params:

        target_user_id: Admin-only, query another user''s credits

        month: Optional "YYYY-MM" format (e.g., "2026-03"). Defaults to current month.'
      operationId: get_credits_used_endpoint_platform_credits_used_get
      parameters:
      - name: target_user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Target User Id
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
          - type: 'null'
          title: Month
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsUsedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/credits/ledger:
    get:
      tags:
      - Platform
      summary: Get Ledger Credits Endpoint
      description: 'Return credits from ``model_usage_ledger`` for a calendar month or rolling window.


        Defaults to the current month (open-ended upper bound, same as ``get_credits_used``).

        Pass ``month=YYYY-MM`` to query a closed historical month (for reconciliation /

        debugging). Same validation window as ``GET /credits/used`` (last 12 months, not future).


        ``since``: ISO lower bound (inclusive) through now — mutually exclusive with ``month``.

        ``since`` may reach up to **730 days** in the past; ``month`` remains limited to the

        same **12-month** window as ``GET /credits/used``.


        ``target_user_id``: admin-only; same role gate as ``GET /credits/used``.'
      operationId: get_ledger_credits_endpoint_platform_credits_ledger_get
      parameters:
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
          - type: 'null'
          title: Month
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Since
      - name: target_user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Target User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerCreditsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/credit-debug/recent-usage:
    get:
      tags:
      - Platform
      summary: Recent Usage
      description: 'The CALLER''s most recent usage-ledger rows, newest first.


        Always scoped to the authenticated user — there is no ``target_user_id``

        parameter, so this cannot expose another account''s usage.


        Rows from ``HIDDEN_BACKGROUND_MODULES`` / ``HIDDEN_BACKGROUND_STEPS`` are

        omitted so the panel only moves when the tester actually does something.

        They are still charged and still stored; this endpoint just does not show

        them.


        Zero-credit rows are omitted too. ``credits_from_cost_usd`` is ``cost/0.02``

        with no rounding, so a row charging real money always has credits > 0 and

        this filter drops nothing current. What it does drop is the tracking-only

        history from Aug 6-20 2026, when this ticket recorded ``cost_usd`` while

        ``effective_credits`` stayed 0 by design: those rows read as

        "0.000000 credits / $0.01673360", which a non-technical tester would

        reasonably report as a billing fault. They cannot surface as the newest row

        today, so this is belt-and-braces — but the cost of being wrong is a

        reopened ticket, and the cost of the guard is one predicate.


        Trade-off accepted: if some future path ever records 0 credits for real

        work, the panel will hide it rather than show a confusing zero. Query the

        ledger directly to audit that case.


        Ordered by ``created_at`` rather than ``id``: there is no ``(user_id, id)``

        index, so ordering by the primary key degrades into a backward PK scan that

        discards every other user''s rows until it finds a match (measured on beta:

        6,124 rows discarded / 5,149 buffers to return ONE row, growing with how

        long the caller has been idle — and this endpoint is polled every 15s).

        ``idx_mul_user_created (user_id, created_at)`` serves this ordering

        directly. Both columns are written at insert time, so the row order is the

        same.'
      operationId: recent_usage_platform_credit_debug_recent_usage_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditDebugResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /platform/debug/tracemalloc:
    get:
      tags:
      - Platform
      summary: Tracemalloc Snapshot
      description: 'Take a tracemalloc snapshot of the current process and return the top allocators.


        If tracemalloc isn''t already running, this starts it and returns

        ``was_tracing=false`` — call again later to see meaningful growth, since

        the first snapshot right after ``start()`` captures almost nothing.'
      operationId: tracemalloc_snapshot_platform_debug_tracemalloc_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 25
          title: Limit
      - name: stack_limit
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Stack Limit
      - name: key_type
        in: query
        required: false
        schema:
          enum:
          - lineno
          - filename
          - traceback
          type: string
          default: lineno
          title: Key Type
      responses:
        '200':
          description: Successful Response
          content:
