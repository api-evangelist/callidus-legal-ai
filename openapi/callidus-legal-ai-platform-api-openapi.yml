components:
  schemas:
    ClientResponse:
      properties:
        id:
          type: string
          title: Id
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        company_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Company Name
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - first_name
      - last_name
      - email
      - phone
      - created_at
      - updated_at
      title: ClientResponse
      description: Client in a matter response (with id and all fields).
    RetrievalBudget:
      properties:
        preset:
          type: string
          enum:
          - legacy
          - narrow
          - standard
          - wide
          title: Preset
        chunk_pool_per_uploader:
          type: integer
          title: Chunk Pool Per Uploader
        global_chunk_cap:
          anyOf:
          - type: integer
          - type: 'null'
          title: Global Chunk Cap
        docs_per_call:
          type: integer
          title: Docs Per Call
        result_limit_ceiling:
          type: integer
          title: Result Limit Ceiling
        chunks_per_doc:
          type: integer
          title: Chunks Per Doc
        chunk_text_chars:
          type: integer
          title: Chunk Text Chars
        triage_order:
          type: string
          enum:
          - insertion
          - score
          title: Triage Order
        triage_max_candidates:
          anyOf:
          - type: integer
          - type: 'null'
          title: Triage Max Candidates
        triage_char_budget:
          anyOf:
          - type: integer
          - type: 'null'
          title: Triage Char Budget
        max_escalations:
          type: integer
          title: Max Escalations
      additionalProperties: false
      type: object
      required:
      - preset
      - chunk_pool_per_uploader
      - global_chunk_cap
      - docs_per_call
      - result_limit_ceiling
      - chunks_per_doc
      - chunk_text_chars
      - triage_order
      - triage_max_candidates
      - triage_char_budget
      - max_escalations
      title: RetrievalBudget
      description: Tunable retrieval + triage knobs for one search-pipeline run.
    FeatureFlagCreate:
      properties:
        key:
          type: string
          title: Key
        value:
          type: string
          title: Value
        type:
          $ref: '#/components/schemas/FlagType'
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - key
      - value
      - type
      title: FeatureFlagCreate
    TaskTodosResponse:
      properties:
        todos:
          additionalProperties:
            items:
              $ref: '#/components/schemas/TodoItem'
            type: array
          type: object
          title: Todos
      type: object
